name: Content Studio CI

on:
  pull_request:
    paths:
      - 'content-studio/**'
      - '.github/workflows/content-studio-ci.yml'
  push:
    branches:
      - 'feature/content-studio-v0.2'
    paths:
      - 'content-studio/**'
      - '.github/workflows/content-studio-ci.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: content-studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build
        run: npm run build
