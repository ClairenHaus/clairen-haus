name: Finalize Ops Council hero source fix

on:
  push:
    paths:
      - ".github/workflows/rebuild-ops-council-hero.yml"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache-bust verified hero assets and remove obsolete rebuild workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('ops-council/index.html')
          text = p.read_text()
          text = text.replace('hero-mobile.webp?v=20260828-final', 'hero-mobile.webp?v=20260828-source')
          text = text.replace('hero-desktop.webp?v=20260828-final', 'hero-desktop.webp?v=20260828-source')
          p.write_text(text)
          PY
          rm .github/workflows/rebuild-ops-council-hero.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ops-council/index.html .github/workflows/rebuild-ops-council-hero.yml
          git commit -m "Finalize verified Ops Council hero assets"
          git push
