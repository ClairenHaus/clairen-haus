<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Michelle Robinson | Clairen Haus</title>
  <meta name="description" content="Michelle Robinson — Systems, Strategy, Structure. Built to Run." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0A0806;
      --s1: #141009;
      --orange: #FF6B2B;
      --orange2: #FF9A5C;
      --gold: #FFB830;
      --white: #F7F2EC;
      --muted: #A89F94;
      --faint: rgba(247,242,236,0.08);
      --display: 'Plus Jakarta Sans', sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--white);
      font-family: var(--display);
      min-height: 100vh;
      display: flex;
      justify-content: center;
    }

    .page {
      width: 100%;
      max-width: 480px;
      padding-bottom: 56px;
    }

    /* Photo */
    .hero {
      width: 100%;
      aspect-ratio: 3 / 4;
      overflow: hidden;
      position: relative;
    }

    .hero img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top right;
      display: block;
    }

    .hero::after {
      content: '';
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 50%;
      background: linear-gradient(to bottom, transparent, var(--bg));
      pointer-events: none;
    }

    /* Profile */
    .profile {
      padding: 0 24px 8px;
      margin-top: -64px;
      position: relative;
      z-index: 1;
      text-align: center;
    }

    .profile h1 {
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--white);
      line-height: 1.1;
    }

    .profile .tagline {
      margin-top: 8px;
      font-size: 0.72rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      font-weight: 600;
      color: var(--orange2);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }

    .profile .tagline::before,
    .profile .tagline::after {
      content: '';
      width: 18px;
      height: 1.5px;
      background: var(--orange2);
    }

    /* Links */
    .links {
      padding: 28px 24px 0;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .btn {
      display: block;
      padding: 15px 20px;
      border-radius: 2px;
      text-decoration: none;
      text-align: center;
      font-family: var(--display);
      font-size: 0.72rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      font-weight: 700;
      transition: opacity 0.2s, border-color 0.2s;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--orange), var(--orange2));
      color: #fff;
      box-shadow: 0 0 28px rgba(255,107,43,0.22);
    }

    .btn-primary:hover { opacity: 0.88; }

    .btn-ghost {
      border: 1.5px solid var(--faint);
      color: var(--white);
      background: transparent;
    }

    .btn-ghost:hover { border-color: rgba(247,242,236,0.35); }

    /* Divider */
    .divider {
      margin: 20px 24px 0;
      height: 1px;
      background: var(--faint);
    }

    /* Socials */
    .socials {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      padding: 20px 24px 0;
    }

    .btn-social {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 13px 8px;
      border: 1px solid var(--faint);
      border-radius: 2px;
      color: var(--muted);
      text-decoration: none;
      text-align: center;
      font-family: var(--display);
      font-size: 0.65rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-weight: 700;
      background: var(--s1);
      transition: color 0.2s, border-color 0.2s;
    }

    .btn-social:hover {
      color: var(--white);
      border-color: rgba(247,242,236,0.3);
    }

    /* QR */
    .qr-section {
      padding: 32px 24px 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    .qr-label {
      font-size: 0.65rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      font-weight: 600;
      color: var(--muted);
    }

    #qrcode img {
      border-radius: 6px;
    }
  </style>
</head>
<body>
  <main class="page">

    <div class="hero">
      <img src="/michelle/michelle-photo.png" alt="Michelle Robinson" width="480" height="640" />
    </div>

    <div class="profile">
      <h1>Michelle Robinson</h1>
      <p class="tagline">Systems · Strategy · Structure</p>
    </div>

    <div class="links">
      <a class="btn btn-primary" href="https://calendly.com/clairenhaus/operations-diagnostic" target="_blank" rel="noopener">Book a Call</a>
      <a class="btn btn-primary" href="https://clairenhaus.com/starter" target="_blank" rel="noopener">Free Resource</a>
      <a class="btn btn-ghost" href="https://clairenhaus.com" target="_blank" rel="noopener">Clairen Haus</a>
      <a class="btn btn-ghost" href="https://clockoutcashin.com" target="_blank" rel="noopener">Clock Out Cash In</a>
      <a class="btn btn-ghost" href="/michelle/Michelle-Robinson.vcf" download="Michelle-Robinson.vcf">Add Me to Your Phone</a>
      <a class="btn btn-ghost" href="tel:+17708788966">Call Michelle</a>
      <a class="btn btn-ghost" href="mailto:michelle@clairenhaus.com">Email Michelle</a>
    </div>

    <div class="divider"></div>

    <div class="socials">
      <a class="btn-social" href="https://www.instagram.com/clairenhaus" target="_blank" rel="noopener">Instagram</a>
      <a class="btn-social" href="https://www.threads.com/@clairenhaus?igshid=NTc4MTIwNjQ2YQ==" target="_blank" rel="noopener">Threads</a>
      <a class="btn-social" href="https://www.linkedin.com/in/michelle-clairenhaus/" target="_blank" rel="noopener">LinkedIn</a>
    </div>

    <div class="qr-section">
      <p class="qr-label">Scan to visit this page</p>
      <img src="/michelle/qr.png" alt="QR code for clairenhaus.com/michelle" width="200" height="200" style="border-radius:6px;" />
    </div>

  </main>
</body>
</html>
