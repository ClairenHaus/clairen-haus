  <style>
    :root {
      --page-bg: #000;

      width: 100%;
      max-width: var(--max-width);
      aspect-ratio: 1024 / 1536;
      background-image: url("michelle-card-bg.png");
      background-size: contain;
      background-position: top center;
      background-repeat: no-repeat;
    }

    .hotspot {
      position: absolute;
      display: block;
      border-radius: 999px;
      text-indent: -9999px;
      overflow: hidden;
      z-index: 2;
    }

    .hotspot:focus-visible {
      outline: 3px solid #ff9700;
      outline-offset: 3px;
      text-indent: 0;
      color: #fff;
      background: rgba(255,151,0,.25);
      display: flex;
      align-items: center;

      font-size: 14px;
