  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

-text-2: #a8a8b2;\n    --text-3: #6c6c78;\n    --text-4: #3e3e48;\n    --accent: #ff5a1f;\n    --accent-soft: #ff7a45;\n    --purple: #7c4ddb;\n    --cyan: #2dc8d6;\n    --rule: rgba(245, 245, 247, 0.08);\n    --rule-strong: rgba(245, 245, 247, 0.22);\n    --sans: 'Albert Sans', system-ui, -apple-system, sans-serif;\n    --mono: 'JetBrains Mono', ui-monospace, Menlo, monospace;\n    --gradient: linear-gradient(90deg, var(--accent) 0%, var(--purple) 50%, var(--cyan) 100%);\n  }\n\n  html { scroll-behavior: smooth; }\n  body {\n    background: var(--bg);\n    color: var(--text);\n    font-family: var(--sans);\n    font-size: 16px;\n    line-height: 1.55;\n    -webkit-font-smoothing: antialiased;\n    text-rendering: optimizeLegibility;\n    overflow-x: hidden;\n  }\n\n  /* Ambient color glows behind everything — pulled from logo */\n  body::before {\n    content: \"\";\n    position: fixed; inset: 0;\n    pointer-events: none; z-index: 0;\n    background:\n      radial-gradient(ellipse 50% 40% at 5% 95%, rgba(255, 90, 31, 0.20) 0%, transparent 60%),\n      radial-gradient(ellipse 50% 40% at 95% 5%, rgba(124, 77, 219, 0.18) 0%, transparent 60%),\n      radial-gradient(ellipse 50% 40% at 95% 95%, rgba(45, 200, 214, 0.16) 0%, transparent 60%);\n  }\n  body::after {\n    content: \"\";\n    position: fixed; inset: 0;\n    pointer-events: none; z-index: 0;\n    background-image: url(\"data:image/svg+xml;base64,PHN2ZyB4bWxucz0naHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmcnIHdpZHRoPScyMDAnIGhlaWdodD0nMjAwJz48ZmlsdGVyIGlkPSduJz48ZmVUdXJidWxlbmNlIHR5cGU9J2ZyYWN0YWxOb2lzZScgYmFzZUZyZXF1ZW5jeT0nMC45JyBudW1PY3RhdmVzPScyJy8+PGZlQ29sb3JNYXRyaXggdmFsdWVzPScwIDAgMCAwIDEgIDAgMCAwIDAgMSAgMCAwIDAgMCAxICAwIDAgMCAwLjA0IDAnLz48L2ZpbHRlcj48cmVjdCB3aWR0aD0nMjAwJyBoZWlnaHQ9JzIwMCcgZmlsdGVyPSd1cmwoI24pJy8+PC9zdmc+\");\n    opacity: 0.6;\n    mix-blend-mode: overlay;\n  }\n\n  nav, main, footer { position: relative; z-index: 1; }\n\n  /* Scroll progress bar */\n  .scroll-bar {\n    position: fixed;\n    top: 0; left: 0; right: 0;\n    height: 2px;\n    background: transparent;\n    z-index: 200;\n  }\n  .scroll-bar .fill {\n    height: 100%;\n    width: 0%;\n    background: var(--gradient);\n    transition: width 0.08s linear;\n  }\n\n  em { font-style: italic; color: var(--accent); font-weight: 500; }\n  .grad {\n    background: var(--gradient);\n    -webkit-background-clip: text;\n    background-clip: text;\n    color: transparent;\n  }\n  em.grad { color: transparent; }\n  ::selection { background: var(--accent); color: var(--text); }\n\n  /* ----------------- NAV ----------------- */\n  nav {\n    position: sticky; top: 0; z-index: 100;\n    padding: 18px 36px;\n    display: grid;\n    grid-template-columns: 1fr auto 1fr;\n    align-items: center;\n    background: rgba(8, 8, 12, 0.7);\n    backdrop-filter: blur(14px);\n    border-bottom: 1px solid var(--rule);\n  }\n  .brand {\n    display: inline-flex; align-items: center;\n    font-family: var(--sans);\n    font-weight: 500;\n    font-size: 14px;\n    letter-spacing: 0.22em;\n    color: var(--text);\n    text-decoration: none;\n    text-transform: uppercase;\n  }\n  .brand .dash {\n    display: inline-block;\n    width: 14px; height: 2px;\n    background: var(--accent);\n    margin: 0 14px;\n    vertical-align: middle;\n  }\n  .brand sup {\n    font-family: var(--mono);\n    font-size: 9px;\n    letter-spacing: 0.16em;\n    vertical-align: super;\n    color: var(--text-3);\n    margin-left: 8px;\n    text-transform: uppercase;\n  }\n  .nav-links {\n    display: flex; gap: 32px;\n    justify-self: center;\n    font-family: var(--mono);\n    font-size: 11px;\n    letter-spacing: 0.16em;\n    text-transform: uppercase;\n  }\n  .nav-links a { color: var(--text-2); text-decoration: none; transition: color 0.15s; }\n  .nav-links a:hover { color: var(--accent); }\n  .nav-cta {\n    justify-self: end;\n    color: var(--text);\n    background: var(--accent);\n    text-decoration: none;\n    font-family: var(--sans);\n    font-size: 12.5px;\n    font-weight: 600;\n    letter-spacing: 0.06em;\n    text-transform: uppercase;\n    padding: 11px 22px;\n    border-radius: 999px;\n    display: inline-flex; align-items: center; gap: 8px;\n    transition: transform 0.15s, box-shadow 0.2s;\n    box-shadow: 0 0 0 0 rgba(255, 90, 31, 0);\n  }\n  .nav-cta:hover { transform: translateY(-1px); box-shadow: 0 8px 32px -4px rgba(255, 90, 31, 0.5); }\n\n  /* ----------------- TYPOGRAPHY ----------------- */\n  .display {\n    font-family: var(--sans);\n    font-weight: 700;\n    line-height: 0.92;\n    letter-spacing: -0.04em;\n    color: var(--text);\n  }\n  .display em { color: var(--accent); font-style: italic; font-weight: 600; }\n  .display em.grad,\n  .display .grad {\n    background: var(--gradient);\n    -webkit-background-clip: text;\n    background-clip: text;\n    color: transparent;\n  }\n\n  h2 {\n    font-family: var(--sans);\n    font-weight: 700;\n    line-height: 0.95;\n    letter-spacing: -0.035em;\n    font-size: clamp(48px, 6.8vw, 104px);\n    color: var(--text);\n  }\n  h2 em { color: var(--accent); font-style: italic; font-weight: 600; }\n\n  h3 {\n    font-family: var(--sans);\n    font-weight: 600;\n    font-size: 28px;\n    line-height: 1.1;\n    letter-spacing: -0.02em;\n    color: var(--text);\n  }\n  h3 em { color: var(--accent); font-style: italic; }\n\n  p { color: var(--text-2); line-height: 1.55; text-wrap: pretty; }\n  .lead {\n    font-family: var(--sans);\n    font-weight: 400;\n    font-size: clamp(20px, 1.8vw, 26px);\n    line-height: 1.35;\n    color: var(--text-2);\n    letter-spacing: -0.005em;\n  }\n  .lead em { color: var(--accent); font-style: italic; font-weight: 500; }\n\n  .kicker {\n    font-family: var(--mono);\n    font-size: 11px;\n    letter-spacing: 0.16em;\n    text-transform: uppercase;\n    color: var(--text-3);\n  }\n  .kicker b { color: var(--text); font-weight: 500; }\n\n  /* ----------------- SECTION ----------------- */\n  section { padding: 140px 36px; position: relative; }\n  .container { max-width: 1320px; margin: 0 auto; }\n\n  .section-head {\n    display: grid;\n    grid-template-columns: 200px 1fr;\n    gap: 40px;\n    align-items: baseline;\n    margin-bottom: 64px;\n    padding-bottom: 24px;\n    border-bottom: 1px solid var(--rule);\n    position: relative;\n  }\n  .section-head::before {\n    content: \"\";\n    position: absolute;\n    left: 0; bottom: -1px;\n    width: 80px; height: 1px;\n    background: var(--gradient);\n  }\n  .section-head .label {\n    font-family: var(--mono);\n    font-size: 11px;\n    letter-spacing: 0.18em;\n    text-transform: uppercase;\n    color: var(--text);\n    font-weight: 500;\n  }\n  .section-head .label .num {\n    color: var(--accent);\n    margin-right: 10px;\n  }\n  .section-head .hd {\n    font-family: var(--mono);\n    font-size: 11px;\n    letter-spacing: 0.16em;\n    text-transform: uppercase;\n    color: var(--text-3);\n  }\n\n  /* ----------------- BUTTONS ----------------- */\n  .btn {\n    display: inline-flex; align-items: center; gap: 14px;\n    background: var(--accent);\n    color: var(--text);\n    border: none;\n    padding: 18px 22px 18px 28px;\n    border-radius: 999px;\n    font-family: var(--sans);\n    font-size: 13.5px;\n    font-weight: 600;\n    letter-spacing: 0.06em;\n    text-transform: uppercase;\n    cursor: pointer;\n    text-decoration: none;\n    transition: transform 0.15s, box-shadow 0.2s;\n    box-shadow: 0 0 0 0 rgba(255, 90, 31, 0);\n  }\n  .btn:hover {\n    transform: translateY(-1px);\n    box-shadow: 0 12px 40px -8px rgba(255, 90, 31, 0.6);\n  }\n  .btn .arrow {\n    width: 32px; height: 32px;\n    background: var(--text); color: var(--ink);\n    border-radius: 50%;\n    display: inline-flex; align-items: center; justify-content: center;\n    transition: transform 0.2s;\n  }\n  .btn:hover .arrow { transform: rotate(-45deg); }\n\n  .btn-ghost {\n    display: inline-flex; align-items: center; gap: 12px;\n    color: var(--text); text-decoration: none;\n    font-family: var(--mono);\n    font-size: 12px; letter-spacing: 0.16em; text-transform: uppercase;\n    padding: 14px 0;\n    border-bottom: 1px solid var(--rule-strong);\n    transition: color 0.15s, border-color 0.15s;\n  }\n  .btn-ghost:hover { color: var(--accent); border-color: var(--accent); }\n\n  /* Accent rule line */\n  .gradient-rule {\n    height: 1px;\n    background: var(--gradient);\n    width: 100%;\n  }\n\n  /* ===================================================\n     HERO\n     =================================================== */\n  #hero {\n    padding: 80px 36px 60px;\n    min-height: calc(100vh - 70px);\n    display: flex; flex-direction: column;\n    justify-content: space-between;\n    position: relative;\n  }\n  /* Logo-style bracket frame around the headline area */\n  .hero-frame {\n    position: relative;\n    padding: 64px 4px 64px 4px;\n  }\n  .hero-frame::before,\n  .hero-frame::after {\n    content: \"\";\n    position: absolute;\n    left: 0; right: 0;\n    height: 1px;\n    background: var(--gradient);\n    opacity: 0.7;\n  }\n  .hero-frame::before { top: 0; }\n  .hero-frame::after { bottom: 0; }\n\n  .hero-top {\n    display: flex; justify-content: space-between; align-items: flex-start;\n    gap: 32px; flex-wrap: wrap;\n  }\n  .hero-top .tag {\n    display: inline-flex; align-items: center; gap: 12px;\n    font-family: var(--mono);\n    font-size: 11px;\n    letter-spacing: 0.16em;\n    text-transform: uppercase;\n    color: var(--text-2);\n  }\n  .hero-top .tag .live {\n    width: 7px; height: 7px; border-radius: 50%;\n    background: var(--accent);\n    box-shadow: 0 0 0 4px rgba(255, 90, 31, 0.2), 0 0 18px rgba(255, 90, 31, 0.6);\n    animation: pulse 2.4s ease-in-out infinite;\n  }\n  @keyframes pulse { 0%, 100% { opacity: 1 } 50% { opacity: 0.45 } }\n\n  .hero-top .meta {\n    display: flex; gap: 32px; flex-wrap: wrap;\n    font-family: var(--mono);\n    font-size: 11px;\n    lette \"footer-meta\">\n      <span>© 2026 Clairen Haus LLC · All rights reserved<\u002Fspan>\n      <span>v 1.0 · Operational<\u002Fspan>\n      <span>ATL · Working everywhere<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Ffooter>\n\n<script>\n  // Scroll progress\n  const fill = document.getElementById('scrollFill');\n  function updateScroll() {\n    const h = document.documentElement;\n    const scrolled = h.scrollTop;\n    const max = h.scrollHeight - h.clientHeight;\n    const pct = max > 0 ? (scrolled / max) * 100 : 0;\n    fill.style.width = pct + '%';\n  }\n  window.addEventListener('scroll', updateScroll, { passive: true });\n  updateScroll();\n\n  // Count-up on proof stats\n  const proofs = document.querySelectorAll('[data-count]');\n  const ease = t => 1 - Math.pow(1 - t, 3);\n  function animateCount(el) {\n    const target = parseFloat(el.dataset.count);\n    const suffix = el.dataset.suffix || '';\n    const prefix = el.dataset.prefix || '';\n    const dur = 1400;\n    const start = performance.now();\n    function tick(now) {\n      const t = Math.min(1, (now - start) / dur);\n      const v = Math.floor(target * ease(t));\n      el.textContent = prefix + v + suffix;\n      if (t < 1) requestAnimationFrame(tick);\n      else if (el.dataset.final) el.innerHTML = el.dataset.final;\n    }\n    requestAnimationFrame(tick);\n  }\n  const io = new IntersectionObserver(entries => {\n    entries.forEach(e => {\n      if (e.isIntersecting) {\n        animateCount(e.target);\n        io.unobserve(e.target);\n      }\n    });\n  }, { threshold: 0.4 });\n  proofs.forEach(p => io.observe(p));\n\n  // Founder's launch ladder + countdown\n  (function () {\n    // Launch begins June 6, 2026, 00:00 local time.\n    const LAUNCH = new Date(2026, 5, 6, 0, 0, 0).getTime();\n    const HOUR = 3600 * 1000;\n    // [price, duration-in-hours] — last tier is the permanent full price.\n    const TIERS = [\n      { price: '$47', hrs: 72 },\n      { price: '$67', hrs: 48 },\n      { price: '$97', hrs: 48 },\n      { price: '$297', hrs: Infinity }\n    ];\n    const pcBig = document.getElementById('pcBig');\n    const timer = document.getElementById('founderTimer');\n    const msg = document.getElementById('founderMsg');\n    const next = document.getElementById('founderNext');\n    const state = document.getElementById('founderState');\n    const rungs = [...document.querySelectorAll('.founder-ladder .rung')];\n    if (!pcBig) return;\n\n    function pad(n) { return String(n).padStart(2, '0'); }\n\n    function boundary(i) {\n      let t = LAUNCH;\n      for (let k = 0; k <= i; k++) t += TIERS[k].hrs * HOUR;\n      return t;\n    }\n\n    function render() {\n      const now = Date.now();\n      // Determine active tier.\n      let active = 0, end = boundary(0);\n      while (active < TIERS.length - 1 && now >= boundary(active)) active++;\n      end = boundary(active);\n\n      pcBig.textContent = TIERS[active].price;\n\n      rungs.forEach((r, i) => {\n        r.classList.toggle('active', i === active);\n        r.classList.toggle('past', i < active);\n      });\n\n      const isLast = active === TIERS.length - 1;\n      if (isLast) {\n        if (state) state.textContent = 'Founder\\u2019s launch ended';\n        if (msg) msg.innerHTML = 'Now at <em>full price<\u002Fem>';\n        const dot = document.querySelector('.founder-label .dot');\n        if (dot) dot.style.display = 'none';\n        return;\n      }\n\n      if (next) next.textContent = TIERS[active + 1].price;\n      let diff = Math.max(0, end - now);\n      const h = Math.floor(diff / HOUR);\n      const m = Math.floor((diff % HOUR) / 60000);\n      const s = Math.floor((diff % 60000) / 1000);\n      if (timer) timer.textContent = pad(h) + ':' + pad(m) + ':' + pad(s);\n    }\n\n    render();\n    setInterval(render, 1000);\n  })();\n<\u002Fscript>\n\n\n\n<\u002Fbody><\u002Fhtml>"
