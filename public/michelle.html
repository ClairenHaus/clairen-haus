<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Michelle Robinson | Links</title>

<style>
:root {
  --white: #f7f4ef;
  --muted: rgba(247, 244, 239, 0.70);
  --orange: #ff8a00;
  --line: rgba(255, 255, 255, 0.30);
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: #030303;
  color: var(--white);
  font-family: Inter, Arial, sans-serif;
}

.page {
  position: relative;
  min-height: 100vh;
  overflow: hidden;
}

/* 🔥 FIXED IMAGE BLOCK */
.portrait {
  position: absolute;
  inset: 0;

  background-image:
    linear-gradient(
      90deg,
      rgba(0,0,0,.95) 0%,
      rgba(0,0,0,.78) 40%,
      rgba(0,0,0,.25) 70%,
      rgba(0,0,0,.05) 100%
    ),
    linear-gradient(
      0deg,
      rgba(0,0,0,.55) 0%,
      rgba(0,0,0,.15) 35%,
      transparent 65%
    ),
    url("michelle-green-linkhub.png");

  background-size: cover;
  background-position: 70% center;

  transform: scale(1.05);
  z-index: 0;
}

.content {
  position: relative;
  z-index: 2;
  width: min(520px, 100%);
  min-height: 100vh;
  padding: 60px 50px;
  display: flex;
  flex-direction: column;
  justify-content: center;
}

h1 {
  margin: 0;
  text-transform: uppercase;
  font-size: clamp(64px, 8vw, 110px);
  line-height: .85;
  font-weight: 900;
}

h1 span {
  display: block;
  color: var(--orange);
}

.tagline {
  margin-top: 28px;
  text-transform: uppercase;
  font-size: 20px;
  font-weight: 800;
}

.tagline span {
  display: block;
  color: var(--orange);
}

.rule {
  width: 80px;
  height: 2px;
  background: var(--orange);
  margin: 30px 0;
}

.links {
  display: grid;
  gap: 10px;
}

.pill {
  display: grid;
  grid-template-columns: 30px 1fr 20px;
  align-items: center;
  gap: 12px;

  padding: 12px 18px;
  border-radius: 999px;
  border: 1px solid var(--line);

  color: var(--white);
  text-decoration: none;
  text-transform: uppercase;
  font-size: 14px;
  font-weight: 700;

  background: rgba(255,255,255,.08);
  backdrop-filter: blur(10px);

  transition: .2s;
}

.pill:hover {
  transform: translateX(5px);
  border-color: var(--orange);
}

.icon {
  text-align: center;
}

.arrow {
  color: var(--orange);
}

.footer {
  margin-top: 40px;
  text-transform: uppercase;
  font-size: 16px;
  color: var(--muted);
}

.footer span {
  color: var(--orange);
}

.qr {
  position: absolute;
  bottom: 40px;
  right: 40px;

  display: flex;
  gap: 12px;
  align-items: center;

  padding: 12px;
  border-radius: 16px;
  border: 1px solid var(--line);

  background: rgba(0,0,0,.4);
  backdrop-filter: blur(10px);
}

.qr img {
  width: 80px;
  background: white;
  padding: 6px;
}

.qr p {
  font-size: 12px;
  color: var(--muted);
}

.qr strong {
  display: block;
  color: white;
  font-size: 11px;
}

/* Mobile */
@media (max-width: 768px) {
  .content {
    padding: 40px 20px 160px;
  }

  .portrait {
    background-position: 65% center;
  }

  .qr {
    left: 20px;
    right: 20px;
  }
}
</style>
</head>

<body>
<main class="page">

  <div class="portrait"></div>

  <section class="content">

    <h1>
      Michelle
      <span>Robinson</span>
    </h1>

    <div class="tagline">
      Systems. Strategy. Structure.
      <span>Built to run.</span>
    </div>

    <div class="rule"></div>

    <nav class="links">

      <a class="pill" href="https://clairenhaus.com">
        <span class="icon">🌐</span>
        <span>ClairenHaus.com</span>
        <span class="arrow">→</span>
      </a>

      <a class="pill" href="https://clockoutcashin.com">
        <span class="icon">🌐</span>
        <span>ClockOutCashIn.com</span>
        <span class="arrow">→</span>
      </a>

      <a class="pill" href="/michelle-contact.vcf">
        <span class="icon">＋</span>
        <span>Add Me to Your Phone</span>
        <span class="arrow">→</span>
      </a>

      <a class="pill" href="tel:+14692202671">
        <span class="icon">☎</span>
        <span>(469) 220-2671</span>
        <span class="arrow">→</span>
      </a>

      <a class="pill" href="#">
        <span class="icon">◎</span>
        <span>Instagram</span>
        <span class="arrow">→</span>
      </a>

      <a class="pill" href="#">
        <span class="icon">@</span>
        <span>Threads</span>
        <span class="arrow">→</span>
      </a>

      <a class="pill" href="#">
        <span class="icon">in</span>
        <span>LinkedIn</span>
        <span class="arrow">→</span>
      </a>

    </nav>

    <div class="footer">
      Strategic thinking.<br>
      Real systems.<br>
      <span>Measurable results.</span>
    </div>

  </section>

  <aside class="qr">
    <img src="michelle-qr.png">
    <p>
      <strong>Scan + Save</strong>
      Open the hub or save contact
    </p>
  </aside>

</main>
</body>
</html>
