<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Home Staging Inventory Operations Assessment</title>
<style>
:root{--bg:#f5f2ed;--card:#fffdfa;--text:#23231f;--muted:#6d6962;--line:#ddd6cc;--brand:#32483f;--soft:#e8eee9;--bad:#8b3c34}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,textarea{font:inherit}.top{position:sticky;top:0;background:rgba(245,242,237,.95);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);z-index:10}
.topin{max-width:940px;margin:auto;padding:16px 22px}.toprow{display:flex;justify-content:space-between;gap:18px}.brand{font-weight:800;font-size:14px}.pcopy{font-size:13px;color:var(--muted)}
.progress{height:7px;margin-top:12px;border-radius:99px;background:#e8e1d8;overflow:hidden}.progress>div{height:100%;background:var(--brand);width:0;transition:.2s}
main{display:flex;justify-content:center;padding:46px 16px 72px}.card{width:min(820px,100%);background:var(--card);border:1px solid var(--line);border-radius:20px;padding:clamp(26px,5vw,52px);box-shadow:0 16px 50px rgba(35,35,31,.08)}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:800;margin-bottom:14px}
h1{font-size:clamp(34px,5vw,54px);line-height:1.03;letter-spacing:-.04em;margin:0 0 20px}h2{font-size:clamp(25px,4vw,36px);line-height:1.12;letter-spacing:-.025em;margin:0 0 12px}
p{color:var(--muted);line-height:1.65}.lead{font-size:18px}.helper{font-size:14px;color:var(--muted);line-height:1.5;margin:8px 0}.req{color:var(--bad)}
.choices{display:grid;gap:10px;margin-top:26px}.choice{display:flex;gap:12px;align-items:center;text-align:left;padding:15px 17px;border:1px solid var(--line);background:#fff;border-radius:13px;min-height:55px;cursor:pointer}
.choice:hover{border-color:#aaa198}.choice.sel{background:var(--soft);border-color:var(--brand);box-shadow:0 0 0 1px var(--brand)}
.dot,.box{width:20px;height:20px;border:1.5px solid #99938b;display:grid;place-items:center;flex:0 0 auto}.dot{border-radius:50%}.box{border-radius:5px}
.choice.sel .dot:after{content:"";width:10px;height:10px;border-radius:50%;background:var(--brand)}.choice.sel .box:after{content:"✓";font-weight:900;color:var(--brand)}
.nav{display:flex;justify-content:space-between;gap:12px;margin-top:34px}.btn{padding:13px 18px;border-radius:12px;border:1px solid var(--brand);font-weight:800;cursor:pointer}.primary{background:var(--brand);color:#fff}.secondary{background:transparent;color:var(--brand)}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin-top:24px}.field{display:flex;flex-direction:column;gap:7px}.full{grid-column:1/-1}label{font-size:14px;font-weight:750}
input,textarea{width:100%;border:1px solid var(--line);border-radius:11px;background:#fff;padding:13px 14px;outline:0}input:focus,textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(50,72,63,.1)}
textarea{min-height:150px;resize:vertical}.small{font-size:12px;color:var(--muted)}.error{color:var(--bad);font-size:14px;margin-top:14px}.hidden{display:none!important}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:26px}.scale button{padding:14px;border:1px solid var(--line);border-radius:12px;background:#fff}.scale button.sel{background:var(--soft);border-color:var(--brand)}
.scale-labels{display:flex;justify-content:space-between;gap:20px;margin-top:8px;color:var(--muted);font-size:12px}.tools{display:flex;flex-wrap:wrap;gap:9px;margin:18px 0 10px}
.tool{padding:10px 13px;border:1px solid var(--line);border-radius:10px;background:#fff;font-weight:750;cursor:pointer}.tool.active{background:#f5e6e3;border-color:#bd786f;color:#7a3028}
.voicepanel{margin-top:12px;padding:13px;border:1px solid var(--line);border-radius:11px;background:#fff}.voicepanel audio{width:100%;margin-top:9px}
.counters{display:grid;gap:10px;margin-top:24px}.crow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 14px;border:1px solid var(--line);border-radius:12px;background:#fff}
.ccontrols{display:flex;align-items:center;gap:10px}.cbtn{width:36px;height:36px;border:1px solid var(--line);border-radius:9px;background:#fff;font-size:20px;cursor:pointer}.cval{min-width:28px;text-align:center;font-weight:850}
.notice{margin-top:20px;background:var(--soft);color:var(--brand);padding:13px 14px;border-radius:11px;font-size:14px}.signals{list-style:none;padding:0;display:grid;gap:9px}.signals li{border:1px solid var(--line);border-radius:11px;background:#fff;padding:13px 14px}
@media(max-width:650px){main{padding:26px 10px 60px}.card{padding:27px 19px}.fields{grid-template-columns:1fr}.full{grid-column:auto}}
</style>

<style id="visual-upgrade">
:root{
  --bg:#f8f2e9;
  --card:#fffdf8;
  --text:#171713;
  --muted:#6c665f;
  --line:#dfd2c2;
  --brand:#173f35;
  --brand-2:#0e2d27;
  --clay:#b65f45;
  --clay-deep:#8f4331;
  --gold:#c79a55;
  --gold-soft:#f1dfbd;
  --sage:#dfe9e2;
  --rose:#f0d7cc;
  --soft:#edf3ef;
  --bad:#9d3f35;
}
body{
  background:
    radial-gradient(circle at 8% 12%, rgba(182,95,69,.13), transparent 24rem),
    radial-gradient(circle at 94% 20%, rgba(199,154,85,.15), transparent 26rem),
    radial-gradient(circle at 82% 88%, rgba(23,63,53,.10), transparent 30rem),
    var(--bg);
}
body:before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  opacity:.38;
  background-image:linear-gradient(rgba(255,255,255,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.08) 1px,transparent 1px);
  background-size:32px 32px;
}
.top{
  background:rgba(248,242,233,.88);
  border-bottom:1px solid rgba(199,154,85,.25);
}
.brand{color:var(--brand-2);letter-spacing:.015em}
.progress{height:8px;background:#eadfd1}
.progress>div{background:linear-gradient(90deg,var(--brand),var(--clay),var(--gold))}
.card{
  position:relative;
  overflow:hidden;
  border:1px solid rgba(199,154,85,.32);
  box-shadow:0 24px 70px rgba(47,37,27,.12);
}
.card:before{
  content:"";
  position:absolute;
  width:160px;height:160px;
  right:-70px;top:-75px;
  border-radius:50%;
  background:linear-gradient(135deg,rgba(182,95,69,.22),rgba(199,154,85,.22));
}
.card>*{position:relative;z-index:1}
.eyebrow{color:var(--clay-deep)}
h1,h2{color:var(--text)}
.choice{
  border-color:#e5d8c9;
  box-shadow:0 3px 12px rgba(47,37,27,.035);
}
.choice:hover{
  border-color:var(--gold);
  box-shadow:0 9px 22px rgba(47,37,27,.07);
  transform:translateY(-1px);
}
.choice.sel{
  background:linear-gradient(135deg,var(--soft),#fff8ef);
  border-color:var(--brand);
  box-shadow:inset 4px 0 0 var(--clay),0 8px 22px rgba(23,63,53,.08);
}
.choice.sel .dot:after{background:var(--clay)}
.choice.sel .box:after{color:var(--clay-deep)}
.primary{
  border-color:var(--brand);
  background:linear-gradient(135deg,var(--brand),var(--brand-2));
  box-shadow:0 8px 20px rgba(23,63,53,.18);
}
.primary:hover{transform:translateY(-1px);box-shadow:0 12px 26px rgba(23,63,53,.24)}
.secondary{border-color:#bda98d;color:var(--brand)}
input:focus,textarea:focus{border-color:var(--clay);box-shadow:0 0 0 3px rgba(182,95,69,.10)}
.scale button.sel{background:linear-gradient(135deg,var(--sage),#fff8ef);border-color:var(--clay);box-shadow:inset 0 -3px 0 var(--clay)}
.notice{background:linear-gradient(135deg,var(--sage),#fbf6ec);border:1px solid #c9d8cd}
.result-hero{
  display:grid;
  grid-template-columns:180px 1fr;
  gap:28px;
  align-items:center;
  padding:22px;
  border:1px solid rgba(199,154,85,.35);
  border-radius:18px;
  background:linear-gradient(135deg,#fff8ed,var(--sage));
  margin:22px 0 30px;
}
.score-ring{
  width:156px;height:156px;border-radius:50%;
  display:grid;place-items:center;
  background:conic-gradient(var(--clay) calc(var(--score)*1%),#eadfd2 0);
  position:relative;
  box-shadow:0 12px 30px rgba(90,58,37,.12);
}
.score-ring:after{
  content:"";
  width:118px;height:118px;border-radius:50%;
  background:var(--card);
  position:absolute;
}
.score-ring .score-inner{position:relative;z-index:2;text-align:center;width:92px}
.score-ring strong{font-size:38px;line-height:1;display:block;color:var(--brand-2)}
.score-ring .score-label{
  display:block;
  max-width:82px;
  margin:7px auto 0;
  font-size:9px;
  line-height:1.12;
  text-transform:uppercase;
  letter-spacing:.08em;
  color:var(--muted);
  font-weight:800;
}
.level-pill{
  display:inline-flex;
  padding:7px 11px;
  border-radius:999px;
  background:var(--brand);
  color:white;
  font-size:12px;
  font-weight:800;
  letter-spacing:.04em;
  margin-bottom:10px;
}
.category-list{display:grid;gap:12px;margin:22px 0 30px}
.category-row{display:grid;grid-template-columns:170px 1fr 46px;gap:12px;align-items:center}
.category-name{font-size:13px;font-weight:750}
.category-track{height:10px;background:#eadfd2;border-radius:999px;overflow:hidden}
.category-fill{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--brand),var(--clay),var(--gold))}
.category-score{text-align:right;font-weight:850;color:var(--brand-2)}
.priority-order{margin:5px 0 0;color:var(--muted);font-size:13px}
.priority-cards{display:grid;gap:12px;margin-top:18px}
.priority-card{padding:16px 17px;border:1px solid #decab4;border-radius:14px;background:linear-gradient(135deg,#fffdf8,#fff5e8)}
.priority-card b{color:var(--brand-2)}
.priority-title{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:5px}
.priority-score{flex:0 0 auto;padding:5px 8px;border-radius:999px;background:var(--sage);color:var(--brand-2);font-size:11px;font-weight:850;letter-spacing:.02em}
.submit-status{margin-top:16px;padding:12px 14px;border-radius:11px;background:#f8efe2;border:1px solid #ead3b2;color:#6e5033;font-size:13px}
.submit-status.ok{background:var(--sage);border-color:#bdd0c1;color:var(--brand-2)}
.submit-status.bad{background:#f8e6e1;border-color:#e0b4aa;color:#81372f}
.disclosure{margin-top:14px;padding:12px 14px;border-left:3px solid var(--gold);background:#fff8eb;color:var(--muted);font-size:12px;line-height:1.5}
@media(max-width:650px){
  .result-hero{grid-template-columns:1fr;text-align:center}
  .score-ring{margin:auto}
  .category-row{grid-template-columns:1fr 42px}
  .category-track{grid-column:1/-1;grid-row:2}
}
</style>


<style id="v4-hardening-styles">
:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.toprow{align-items:center}
.score-ring .score-label{font-size:11px;line-height:1.05;letter-spacing:.05em}
.context-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:16px 0 28px}
.context-card,.impact-card,.alignment-card{
  padding:15px 16px;border:1px solid #decab4;border-radius:14px;
  background:linear-gradient(135deg,#fffdf8,#fff7ec)
}
.context-card span,.impact-card span{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.08em;font-weight:800}
.context-card strong,.impact-card strong{display:block;margin-top:5px;color:var(--brand-2);font-size:16px}
.impact-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:16px 0 28px}
.priority-reason{display:block;margin-top:8px;color:#735d4f;font-size:12px;line-height:1.45}
.alignment-card{margin:16px 0 28px}
.alignment-card p{margin:5px 0;color:var(--text)}
.resume-box{margin-top:22px;padding:15px;border:1px solid #d9c6ad;border-radius:14px;background:#fff8ec}
.resume-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.error[role="alert"]{min-height:20px}
@media(max-width:650px){
  .toprow{align-items:flex-start;gap:8px}
  .brand{max-width:70%;font-size:12px;line-height:1.25}
  .pcopy{font-size:11px}
  .context-grid,.impact-grid{grid-template-columns:1fr}
}
</style>


<style id="v5-polish">
.section-context{
  margin:0 0 22px;
  padding:12px 14px;
  border-left:3px solid var(--gold);
  background:#fff8eb;
  color:var(--muted);
  border-radius:0 10px 10px 0;
  font-size:13px;
  line-height:1.5;
}
.completed-box{
  margin-top:22px;
  padding:16px;
  border:1px solid #c9d8cd;
  background:var(--sage);
  border-radius:14px;
}
.completed-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.voice-restore-note{font-size:12px;color:var(--muted);margin-top:8px}
</style>

</head>
<body>
<header class="top"><div class="topin"><div class="toprow"><div class="brand">Home Staging Inventory Operations Assessment</div><div id="pcopy" class="pcopy">Ready to begin</div></div><div class="progress"><div id="bar"></div></div></div></header>
<main><section id="card" class="card"></section></main>
<script>
const ROLES=["Owner / Founder","General Manager","Operations Manager","Lead Designer / Creative Director","Staging Designer","Design Assistant","Inventory Manager","Warehouse Manager","Warehouse Associate","Installation / Moving Crew","Driver","Purchasing / Procurement","Project Coordinator","Scheduling / Dispatch","Sales / Business Development","Client / Realtor Relations","Administrative Support","Bookkeeping / Finance","Marketing","Contractor / Temporary Crew","Other"];
let A={},notes={},steps=[],idx=-1,recorder=null,chunks=[],timer=null,recognition=null;

const S=[
["About Your Company","A few basics help put the rest of your answers in context.",[
{id:"lead",t:"lead",q:"Tell us about your company",req:1}
]],
["Your Staging Operation","This section looks at the size, structure, and responsibilities inside your staging business.",[
{id:"projects",t:"single",q:"Approximately how many staging projects does your company complete in a typical month?",o:["1–5","6–10","11–20","21–40","41–75","76+","It varies significantly"],req:1},
{id:"locations",t:"single",q:"How many physical locations currently store staging inventory?",h:"Include warehouses, storage units, showrooms, offices, or other inventory storage locations.",o:["1","2","3","4","5+"],req:1},
{id:"inventory_size",t:"single",q:"Approximately how large is your active inventory?",o:["Fewer than 250 items","250–499","500–999","1,000–2,499","2,500–4,999","5,000+","I do not know"],req:1},
{id:"team_size",t:"single",q:"How many people currently work in or regularly support the business?",h:"Include owners, employees, regular contractors, warehouse staff, designers, installers, drivers, and administrative support.",o:["Just me","2–5","6–10","11–20","21–40","41+","It varies because we use contractors or temporary crews"],req:1},
{id:"roles",t:"multi",q:"Which roles currently exist in your business?",o:ROLES,req:1},
{id:"role_counts",t:"counts",q:"Approximately how many people work in each selected role?",h:"People who perform more than one role can be counted in more than one category.",show:()=>A.roles?.length,req:1},
{id:"handlers",t:"dynamicMulti",q:"Which roles physically handle inventory during its lifecycle?",h:"Think about receiving, storing, pulling, loading, installation, de-staging, returns, cleaning, repairs, and inventory counts.",src:"roles",extra:["No defined responsibility","It varies depending on the project"],req:1},
{id:"deciders",t:"dynamicMulti",q:"Which roles make decisions about inventory?",src:"roles",req:1},
{id:"responsibility",t:"single",q:"How clearly are inventory responsibilities divided among team members today?",o:["Very clear. Each role has defined responsibilities.","Mostly clear, with some overlap.","Responsibilities depend on the project.","Several people handle the same work without defined ownership.","Most inventory knowledge and decisions depend on one or two people.","We do not have defined inventory responsibilities."],req:1},
{id:"structure",t:"single",q:"How is your team primarily structured?",o:["Mostly employees","Mostly contractors","Mix of employees and contractors","Core internal team plus temporary installation crews","Owner-led with contractors as needed","Other"],req:1},
{id:"coverage",t:"single",q:"When someone who normally handles inventory is unavailable, how easily can another team member take over?",o:["Easily. The process and information are documented.","Usually, with some questions.","It depends on the task.","It is difficult without the usual person.","Certain inventory processes stop until that person is available."],req:1}
]],
["Inventory Records","This section looks at what inventory information exists today and how consistently it is maintained.",[
{id:"tracking",t:"multi",q:"How do you currently keep track of your inventory?",o:["Inventory management software","Spreadsheet","Accounting system","Photos or photo folders","Paper records","Labels or handwritten tags","Notes on phones","Team knowledge or memory","We do not have a consistent inventory record","Other"],req:1},
{id:"documented",t:"single",q:"How much of your active inventory is currently documented?",o:["Nearly all of it","Most of it","About half","Some of it","Very little","I do not know"],req:1},
{id:"fields",t:"multi",q:"What information can you typically see about an inventory item today?",o:["Photo","Item name or description","Category","Color","Style","Dimensions","Purchase date","Purchase cost","Current location","Current project","Availability","Condition","Repair history","Usage history","None of these consistently"],req:1}
]],
["Purchasing and Receiving","This section looks at what happens from the moment inventory is purchased until it is received and recorded.",[
{id:"entry",t:"single",q:"When new inventory is purchased, when does it usually become part of your inventory records?",o:["When the order is placed","When the item ships","When the item arrives","When someone has time to enter it","It varies","We do not formally enter new purchases into an inventory system"],req:1},
{id:"receiving",t:"multi",q:"What typically happens when new inventory arrives?",o:["Quantity is verified","Condition is inspected","Photos are taken","Purchase information is recorded","The item receives an ID or label","The storage location is recorded","Shipping damage is documented","Someone signs or confirms receipt","The item is simply put away","It depends on who receives it"],req:1},
{id:"trace",t:"single",q:"How consistently can you connect a physical item back to its original purchase information?",o:["Very easily","Usually","Sometimes","Rarely","We generally cannot","I am not sure"],req:1}
]],
["Identification and Storage","This section looks at how items are identified, organized, located, and stored.",[
{id:"ids",t:"single",q:"Do individual inventory items currently have unique identifiers?",o:["Yes, almost everything","Yes, but only certain items","No","I am not sure"],req:1},
{id:"idtype",t:"multi",q:"What type of identifier do you use?",o:["Barcode","QR code","SKU","Serial or asset number","Printed label","Handwritten label","Manufacturer identifier","Other"],show:()=>["Yes, almost everything","Yes, but only certain items"].includes(A.ids),req:1},
{id:"defined",t:"single",q:"Does your warehouse or storage area use defined storage locations?",o:["Yes, down to a specific shelf or location","Yes, by general area or zone","Some areas do","No","It varies by location"],req:1},
{id:"find",t:"single",q:"How does someone determine where a specific item is stored?",o:["Exact location is available in a system","Location is recorded in a spreadsheet or document","Storage areas are labeled and staff know where categories belong","Staff generally remember where things are","Someone searches until they find it","It varies"],req:1},
{id:"searchfreq",t:"single",q:"How often does your team spend extra time looking for inventory?",o:["Almost never","A few times per year","Monthly","Weekly","Several times per week","Almost every project","I do not know"],req:1}
]],
["Project Planning and Inventory Reservations","This section looks at how inventory is selected, reserved, and prepared for upcoming staging projects.",[
{id:"select",t:"multi",q:"How is inventory selected for an upcoming staging project?",o:["Inventory software","Spreadsheet or list","Photos","Physical warehouse walkthrough","Designer memory","Warehouse team knowledge","Previous project references","Paper notes","Other"],req:1},
{id:"reserve",t:"single",q:"Before inventory is committed to a project, can your team reliably see whether that item is already reserved elsewhere?",o:["Yes, in real time","Usually","Sometimes","No","We do not formally reserve inventory"],req:1},
{id:"conflicts",t:"single",q:"How often do availability conflicts happen?",h:"Examples include an item being planned for two projects or discovering too late that something is unavailable.",o:["Almost never","A few times per year","Monthly","Weekly","Several times per week","I do not know"],req:1},
{id:"pull",t:"single",q:"How are project pull lists created?",o:["Automatically from our inventory system","Manually in a spreadsheet or document","Written or printed manually","Created from photos","Communicated verbally","We do not consistently use pull lists","Other"],req:1},
{id:"pulldata",t:"multi",q:"What information does the pull list normally include?",o:["Item name","Item ID","Photo","Quantity","Warehouse location","Room assignment","Project information","Special handling instructions","None of these consistently"],show:()=>A.pull&&A.pull!=="We do not consistently use pull lists",req:1}
]],
["Picking and Loading","This section looks at how your team pulls, verifies, and loads the correct inventory for each project.",[
{id:"pick",t:"single",q:"How does the warehouse team confirm that the correct inventory was pulled for a project?",o:["Items are scanned","Items are checked against a digital list","Items are checked against a printed list","Designer or manager visually confirms","Warehouse staff rely on experience","There is no formal confirmation step","It varies"],req:1},
{id:"vehicle",t:"single",q:"Can you see exactly which inventory has been loaded onto a particular truck, van, or trailer?",o:["Yes, in real time","Yes, but only through manual records","Sometimes","No","We do not need to track this today"],req:1},
{id:"arrival",t:"single",q:"How often does a crew arrive at a property and discover that something is missing, incorrect, or was left behind?",o:["Almost never","A few times per year","Monthly","Weekly","Several times per week","I do not know"],req:1}
]],
["Installation","This section looks at how installed inventory, room placement, substitutions, and project changes are recorded.",[
{id:"install",t:"multi",q:"Once inventory reaches a property, how is the final installation recorded?",o:["Inventory is scanned or digitally confirmed","Items are checked off a list","Photos are taken","Room assignments are recorded","Changes and substitutions are documented","The designer knows what was installed","Nothing is formally recorded","It varies"],req:1},
{id:"changes",t:"single",q:"If an item is substituted, moved to another room, or not used during installation, how reliably is that change recorded?",o:["Always","Usually","Sometimes","Rarely","Never","We do not currently track that level of detail"],req:1}
]],
["De-Staging and Returns","This section looks at how inventory is retrieved, returned, and prepared to re-enter circulation.",[
{id:"retrieve",t:"single",q:"When it is time to remove a staging installation, does the crew have a reliable list of everything that should be retrieved?",o:["Yes, generated from what was actually installed","Yes, but the list is manually maintained","Usually","Sometimes","No","We rely mostly on the crew or designer knowing what belongs to us"],req:1},
{id:"missing",t:"single",q:"How often is an item discovered missing during or after de-staging?",o:["Almost never","A few times per year","Monthly","Weekly","Several times per week","I do not know"],req:1},
{id:"return",t:"single",q:"What usually happens when inventory returns to storage?",o:["Every item is inspected before becoming available again","Most items are inspected","Only obviously damaged items are inspected","Items are generally put away immediately","It depends on who handles the return"],req:1}
]],
["Team Handoffs and Accountability","This section looks at what happens when responsibility for inventory moves between people or teams.",[

const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
function rebuild(){steps=[];S.forEach((s,si)=>{steps.push({k:"section",si});s[2].forEach(q=>{if(!q.show||q.show())steps.push({k:"q",si,q})})})}

const val = (group,key,fallback=50) => scoreMap[group]?.[A[key]] ?? fallback;
const ratio = (key, positive, fallback=35) => {
  const arr=A[key]||[];
  if(!arr.length) return fallback;
  const hits=positive.filter(x=>arr.includes(x)).length;
  return Math.round((hits/positive.length)*100);
};
const avg = xs => Math.round(xs.reduce((a,b)=>a+b,0)/Math.max(xs.length,1));

function calculateScores(){
  const categories = {
    "Inventory Control": avg([
      val("documented","documented"),
      val("ids","ids"),
      ratio("fields",["Photo","Item name or description","Current location","Current project","Availability","Condition"])
    ]),
    "Warehouse Organization": avg([
      val("defined","defined"),
      val("find","find"),
      val("frequency","searchfreq")
    ]),
    "Project Allocation": avg([
      val("reserve","reserve"),
      val("frequency","conflicts"),
      val("pull","pull"),
      ratio("pulldata",["Item ID","Photo","Quantity","Warehouse location","Room assignment","Project information"],45)
    ]),
    "Picking & Loading": avg([
      val("pick","pick"),
      val("vehicle","vehicle"),
      val("frequency","arrival")
    ]),
    "Install & Return Control": avg([
      ratio("install",["Inventory is scanned or digitally confirmed","Items are checked off a list","Photos are taken","Room assignments are recorded","Changes and substitutions are documented"],40),
      val("changes","changes"),
      val("retrieve","retrieve"),
      val("frequency","missing"),
      val("return","return")
    ]),
    "Team & Handoffs": avg([
      val("responsibility","responsibility"),
      val("coverage","coverage"),
      val("handoffconfirm","handoffconfirm"),
      val("frequency","handofffreq"),
      val("handofftrace","handofftrace"),
      Math.max(0,Math.min(100,(Number(A.handoffowner||3)-1)*25))
    ]),
    "Condition Management": avg([
      ratio("receiving",["Condition is inspected","Photos are taken","Shipping damage is documented"],45),
      val("return","return"),
      val("history","history"),
      ratio("maintenance",["Inventory software","Spreadsheet","Task management system"],35)
    ]),
    "Financial & Lifecycle": avg([
      val("trace","trace"),
      ratio("financial",["Original purchase price","Purchase date","Replacement cost","Number of projects it has been used on","Total time it has spent staged","Cleaning costs","Repair costs","Current condition","Current location","Sale or disposal information"],30),
      ratio("retire",["Condition","Age","Style trends","Repair cost","Lack of use","Storage constraints","Financial data"],40)
    ]),
    "Operational Visibility": avg([
      Math.max(0,Math.min(100,(Number(A.confidence||3)-1)*25)),
      val("documented","documented"),
      val("find","find"),
      val("reserve","reserve"),
      val("vehicle","vehicle")
    ])
  };
  const overall=avg(Object.values(categories));
  let level, summary;
  if(overall>=85){level="Optimized";summary="Your inventory operation is highly controlled. The next opportunity is using the data for forecasting, utilization, purchasing, and lifecycle decisions."}
  else if(overall>=70){level="Controlled";summary="Your core inventory processes are working, with a few areas where stronger automation, traceability, or lifecycle visibility could reduce manual work."}
  else if(overall>=55){level="Structured";summary="You have useful processes in place, but key parts still depend on manual updates, separate records, or team knowledge."}
  else if(overall>=40){level="Developing";summary="Your operation has working practices, but limited real-time visibility and inconsistent handoffs can create avoidable labor, errors, and inventory risk."}
  else {level="Reactive";summary="Inventory control depends heavily on people, memory, or disconnected records. Establishing a reliable asset and movement record should come before advanced automation."}
  return {overall,level,summary,categories};
}

const recMap={
  "Inventory Control":"Create one permanent digital record and unique identifier for every trackable asset.",
  "Warehouse Organization":"Define scannable warehouse locations so item location changes can be recorded without typing.",
  "Project Allocation":"Add real-time availability, reservations, and project-level inventory assignment before warehouse pulling begins.",
  "Picking & Loading":"Use scan-based pull and vehicle loading confirmation to prevent wrong or missing items.",
  "Install & Return Control":"Create an installed-item record that becomes the de-staging retrieval list and return inspection record.",
  "Team & Handoffs":"Assign ownership at each inventory stage and require a recorded confirmation when responsibility changes.",
  "Condition Management":"Create inspection, cleaning, damage, and repair queues tied to each asset's history.",
  "Financial & Lifecycle":"Connect purchase, usage, maintenance, sale, donation, and retirement data to the permanent asset record.",
  "Operational Visibility":"Build a single operational dashboard for availability, location, projects, exceptions, maintenance, and upcoming movement."
};
function recommendations(scores){
  return Object.entries(scores.categories)
    .sort((a,b)=>a[1]-b[1])
    .slice(0,3)
    .map(([category,score])=>({category,score,recommendation:recMap[category]}));
}

function fileExt(type){
  if(type?.includes("ogg"))return "ogg";
  if(type?.includes("mp4"))return "m4a";
  if(type?.includes("mpeg"))return "mp3";
  if(type?.includes("wav"))return "wav";
  return "webm";
}
async function uploadVoiceNotes(submissionId){
  const paths=[];
  for(const [questionId,note] of Object.entries(notes)){
    const filename=`${questionId}-${Date.now()}.${fileExt(note.type)}`;
    const path=`${submissionId}/${filename}`;
    const res=await fetch(`${SUPABASE_URL}/storage/v1/object/${VOICE_BUCKET}/${path}`,{
      method:"POST",
      headers:{
        "apikey":SUPABASE_ANON_KEY,
        "Authorization":`Bearer ${SUPABASE_ANON_KEY}`,
        "Content-Type":note.type||"audio/webm",
        "x-upsert":"false"
      },
      body:note.blob
    });
    if(!res.ok) throw new Error(`Voice upload failed (${res.status})`);
    paths.push({question_id:questionId,path,mime_type:note.type,recorded_at:note.at});
  }
  return paths;
}
async function saveAssessment(scores,recs){
  const submissionId=crypto.randomUUID();
  const voicePaths=await uploadVoiceNotes(submissionId);
  const payload={
    id:submissionId,
    respondent_name:A.name,
    company_name:A.company,
    email:A.email,
    phone:A.phone||null,
    website:A.website||null,
    overall_score:scores.overall,
    maturity_level:scores.level,
    category_scores:scores.categories,
    recommendations:recs,
    responses:A,
    voice_note_paths:voicePaths,
    completed_at:new Date().toISOString(),
    user_agent:navigator.userAgent
  };
  const res=await fetch(`${SUPABASE_URL}/rest/v1/staging_inventory_assessments`,{
    method:"POST",
    headers:{
      "apikey":SUPABASE_ANON_KEY,
      "Authorization":`Bearer ${SUPABASE_ANON_KEY}`,
      "Content-Type":"application/json",
      "Prefer":"return=minimal"
    },

  });
  if(!res.ok){
    const body=await res.text();
    throw new Error(`Assessment save failed (${res.status}): ${body.slice(0,180)}`);
  }
  return submissionId;
}

async function persistResults(scores,recs){
  const node=document.querySelector("#submitStatus");
  if(!node)return;

  if(IS_PREVIEW_MODE){
    node.className="submit-status";
    node.textContent="Preview mode: results are shown here, but this test response was not sent to Supabase.";
    return;
  }

  node.className="submit-status";
  node.textContent="Saving assessment responses…";
  try{
    const id=await saveAssessment(scores,recs);
    node.className="submit-status ok";
    node.textContent="Assessment saved successfully. Reference: "+id.slice(0,8).toUpperCase();
    window.__lastSubmissionId=id;
  }catch(e){
    node.className="submit-status bad";
    node.textContent="Your results are available, but the submission could not be saved. Please try again.";
    console.error(e);
  }
}

// ----- Local recovery -----
function serializableState(){
  return {
    answers:A,
    idx,
    savedAt:new Date().toISOString()
  };
}
function saveLocal(){
  try{ localStorage.setItem(V4_STORAGE_KEY,JSON.stringify(serializableState())); }catch(e){}
}
function readLocal(){
  try{
    const raw=localStorage.getItem(V4_STORAGE_KEY);
    return raw?JSON.parse(raw):null;
  }catch(e){return null}
}
function clearLocal(){
  try{localStorage.removeItem(V4_STORAGE_KEY)}catch(e){}
}
function hasMeaningfulSavedState(){
  const s=readLocal();
  return !!(s && s.answers && Object.keys(s.answers).length);
}
function restoreLocal(){
  const s=readLocal();
  if(!s||!s.answers)return false;
  A=s.answers||{};
  sanitizeBranches();
  rebuild();
  idx=Math.min(Math.max(Number(s.idx)||0,0),Math.max(0,steps.length-1));
  return true;
}

// ----- Branch cleanup -----
function sanitizeBranches(){
  if(!["Yes, almost everything","Yes, but only certain items"].includes(A.ids)) delete A.idtype;
  if(A.pull==="We do not consistently use pull lists") delete A.pulldata;
  if(!A.riskhandoff || ["No particular handoff stands out","I am not sure"].includes(A.riskhandoff)) delete A.riskexplain;
  if(A.problem!=="Yes") delete A.problemtext;
  if(!Array.isArray(A.systems) || !A.systems.some(x=>!["Paper-based process","None"].includes(x))) delete A.systemnames;
  if(!["Yes, definitely","Probably","Possibly"].includes(A.capacity_more)) delete A.capacity_projects;

  if(Array.isArray(A.roles)){
    A.role_counts=A.role_counts||{};
    Object.keys(A.role_counts).forEach(r=>{if(!A.roles.includes(r))delete A.role_counts[r]});
    if(Array.isArray(A.handlers)) A.handlers=A.handlers.filter(x=>A.roles.includes(x)||["No defined responsibility","It varies depending on the project"].includes(x));
    if(Array.isArray(A.deciders)) A.deciders=A.deciders.filter(x=>A.roles.includes(x));
  }

  if(Array.isArray(A.handoffs) && A.riskhandoff){
    const allowed=[...A.handoffs.filter(x=>x!=="Most inventory is handled by the same person or team throughout the process"),"No particular handoff stands out","I am not sure"];
    if(!allowed.includes(A.riskhandoff)){ delete A.riskhandoff; delete A.riskexplain; }
  }
}

  install:["Nothing is formally recorded"],
  handoffs:["Most inventory is handled by the same person or team throughout the process"],
  handoffcomm:["There is no consistent handoff process"],
  handoffproblems:["We rarely experience handoff problems"],
  maintenance:["We do not have a consistent process"],
  financial:["None of these consistently"],
  retire:["We do not have a defined process"],
  systems:["None"]
};
function normalizeMulti(qid,arr,chosen){
  const exclusive=EXCLUSIVE[qid]||[];
  if(exclusive.includes(chosen)) return [chosen];
  return arr.filter(x=>!exclusive.includes(x));
}
function clearError(){
  const e=document.querySelector("#error");
  if(e){e.textContent="";e.classList.add("hidden")}
}

scale=function(q){

lead=function(){

counts=function(){

    <div class=crow data-role="${esc(r)}">

        <button type=button class=cbtn aria-label="Decrease ${esc(r)} count" onclick="count('${encodeURIComponent(r)}',-1)">−</button>

// ----- Validation and answer handling -----
answered=function(q){
  if(q.t==="lead") return !!(A.name&&A.company&&A.email);
  if(q.t==="counts"){
    const roles=A.roles||[];
    return roles.length>0 && roles.every(r=>Number((A.role_counts||{})[r]||0)>0);
  }
  if(["multi","dynamicMulti"].includes(q.t)) return Array.isArray(A[q.id])&&A[q.id].length>0;
  if(q.optional) return true;
  return A[q.id]!==undefined&&A[q.id]!==null&&String(A[q.id]).trim()!=="";
};

bind=function(q){
  if(q.t==="lead"){
    ["name","company","email","phone","website"].forEach(id=>{
      const node=document.querySelector("#"+id);
      node.addEventListener("input",e=>{A[id]=e.target.value.trim();clearError();saveLocal()});
    });
  }

  if(["single","dynamicSingle"].includes(q.t)){
    document.querySelectorAll(".choice").forEach(b=>b.onclick=()=>{
      A[q.id]=b.dataset.opt;
      document.querySelectorAll(".choice").forEach(x=>{x.classList.remove("sel");x.setAttribute("aria-checked","false")});
      b.classList.add("sel");b.setAttribute("aria-checked","true");
      sanitizeBranches();clearError();rebuild();progress();saveLocal();
    });
  }

  if(["multi","dynamicMulti"].includes(q.t)){
    document.querySelectorAll(".choice").forEach(b=>b.onclick=()=>{
      const o=b.dataset.opt;
      let a=[...(A[q.id]||[])];
      if(a.includes(o)){
        a=a.filter(x=>x!==o);
      }else{
        if(q.max&&a.length>=q.max){err("Please select no more than "+q.max+".");return}
        a.push(o);
        a=normalizeMulti(q.id,a,o);
      }
      A[q.id]=a;
      document.querySelectorAll(".choice").forEach(x=>{
        const selected=a.includes(x.dataset.opt);
        x.classList.toggle("sel",selected);
        x.setAttribute("aria-checked",selected?"true":"false");
      });
      if(q.id==="roles"){
        A.role_counts=A.role_counts||{};
        Object.keys(A.role_counts).forEach(r=>{if(!a.includes(r))delete A.role_counts[r]});
      }
      sanitizeBranches();clearError();rebuild();progress();saveLocal();
    });
  }

  if(q.t==="scale"){
    document.querySelectorAll("[data-scale]").forEach(b=>b.onclick=()=>{
      A[q.id]=+b.dataset.scale;
      document.querySelectorAll("[data-scale]").forEach(x=>{x.classList.remove("sel");x.setAttribute("aria-checked","false")});
      b.classList.add("sel");b.setAttribute("aria-checked","true");
      clearError();progress();saveLocal();
    });
  }

  if(q.t==="long"){
    const t=document.querySelector("#txt");
    t.oninput=e=>{A[q.id]=e.target.value;clearError();saveLocal()};
  }
};

count=function(encoded,delta){
  const role=decodeURIComponent(encoded);
  A.role_counts=A.role_counts||{};
  A.role_counts[role]=Math.max(0,(A.role_counts[role]||0)+delta);
  const row=[...document.querySelectorAll(".crow")].find(x=>x.dataset.role===role);
  if(row){
    const value=row.querySelector(".cval");
    if(value)value.textContent=A.role_counts[role];
  }
  clearError();saveLocal();
};

valid=function(){
  const x=steps[idx];
  if(!x||x.k!=="q")return true;
  const q=x.q;
  if(q.t==="lead"){
    if(!(A.name&&A.company&&A.email)){err("Please complete your name, company name, and email.");return false}
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(A.email)){err("Please enter a valid email address.");return false}
    return true;
  }
  if(q.t==="counts"&&!answered(q)){err("Please enter at least 1 for each selected role.");return false}
  if(q.optional)return true;
  if(!answered(q)){err("Please select an answer before continuing.");return false}
  return true;
};

err=function(m){
  const e=document.querySelector("#error");
  if(e){e.textContent=m;e.classList.remove("hidden");e.setAttribute("role","alert");}
};

// ----- Accurate progress -----
progress=function(){
  rebuild();
  const qSteps=steps.filter(x=>x.k==="q");
  let completedBefore=0;
  for(let i=0;i<idx;i++) if(steps[i]?.k==="q") completedBefore++;
  let p=idx<0?0:Math.round((completedBefore/Math.max(1,qSteps.length))*100);
  p=Math.max(0,Math.min(99,p));
  const bar=document.querySelector("#bar");
  if(bar)bar.style.width=p+"%";
  const copy=document.querySelector("#pcopy");
  if(copy)copy.textContent=idx<0?"Ready to begin":p+"% complete";
  if(progressNode)progressNode.setAttribute("aria-valuenow",String(p));
};

const _renderV4Base=render;
render=function(){
  sanitizeBranches();
  _renderV4Base();
  saveLocal();
};

next=function(){
  if(!valid())return;
  sanitizeBranches();
  const cur=steps[idx];
  rebuild();
  const i=steps.findIndex(x=>x.k===cur.k&&(x.k==="section"?x.si===cur.si:x.q.id===cur.q.id));
  idx=(i<0?idx:i)+1;
  saveLocal();
  render();
};
back=function(){
  sanitizeBranches();rebuild();idx=Math.max(-1,idx-1);saveLocal();render();
};

// ----- Scoring -----
function mscore(key,map,fallback=50){return map[A[key]]??fallback}
function freqScore(key){
  return mscore(key,{"Almost never":100,"A few times per year":85,"Monthly":45,"Weekly":20,"Several times per week":5,"Almost every project":5,"I do not know":null},50);
}
function avgKnown(values){
  const xs=values.filter(v=>Number.isFinite(v));
  return xs.length?Math.round(xs.reduce((a,b)=>a+b,0)/xs.length):0;
}
function fractionScore(key,positive,negative=[]){
  const arr=A[key]||[];
  if(!arr.length)return 0;
  if(negative.some(x=>arr.includes(x)))return 5;
  const hits=positive.filter(x=>arr.includes(x)).length;
  return Math.round(hits/Math.max(1,positive.length)*100);
}
function trackingScore(){
  const a=A.tracking||[];
  if(a.includes("We do not have a consistent inventory record"))return 5;
  let s=0;
  if(a.includes("Inventory management software"))s=Math.max(s,100);
  if(a.includes("Spreadsheet")||a.includes("Accounting system"))s=Math.max(s,65);
  if(a.includes("Photos or photo folders")||a.includes("Paper records")||a.includes("Labels or handwritten tags"))s=Math.max(s,40);
  if(a.includes("Notes on phones")||a.includes("Team knowledge or memory"))s=Math.max(s,20);
  return s||35;
}
function systemsMaturity(){
  const a=A.systems||[];
  if(a.includes("None"))return 5;
  let s=25;
  if(a.includes("Inventory management software")||a.includes("Warehouse management software"))s+=30;
  if(a.includes("Project management software")||a.includes("CRM"))s+=15;
  if(a.includes("Accounting software")||a.includes("Payment / invoicing software"))s+=15;
  if(a.includes("Spreadsheet"))s+=5;
  if(a.includes("Paper-based process"))s-=10;
  return Math.max(5,Math.min(100,s));
}
function projectSelectionScore(){
  const a=A.select||[];
  if(a.includes("Inventory software"))return 100;
  if(a.includes("Spreadsheet or list"))return 70;
  if(a.includes("Photos")||a.includes("Previous project references"))return 55;
  if(a.includes("Physical warehouse walkthrough"))return 45;
  if(a.includes("Designer memory")||a.includes("Warehouse team knowledge"))return 25;
  return 40;
}
function processStepScore(key,positives,hardNegatives=[]){
  const a=A[key]||[];
  if(hardNegatives.some(x=>a.includes(x)))return 5;
  return fractionScore(key,positives);
}
calculateScores=function(){
  const categories={
    "Inventory Control":avgKnown([
      trackingScore(),
      mscore("documented",{"Nearly all of it":100,"Most of it":80,"About half":55,"Some of it":30,"Very little":10,"I do not know":35}),
      mscore("ids",{"Yes, almost everything":100,"Yes, but only certain items":65,"No":10,"I am not sure":30}),
      processStepScore("fields",["Photo","Item name or description","Category","Dimensions","Purchase date","Purchase cost","Current location","Current project","Availability","Condition"],["None of these consistently"])
    ]),
    "Warehouse Organization":avgKnown([
      mscore("defined",{"Yes, down to a specific shelf or location":100,"Yes, by general area or zone":75,"Some areas do":50,"No":10,"It varies by location":35}),
      mscore("find",{"Exact location is available in a system":100,"Location is recorded in a spreadsheet or document":70,"Storage areas are labeled and staff know where categories belong":55,"Staff generally remember where things are":25,"Someone searches until they find it":5,"It varies":30}),
      freqScore("searchfreq")
    ]),
    "Project Allocation":avgKnown([
      projectSelectionScore(),
      mscore("reserve",{"Yes, in real time":100,"Usually":75,"Sometimes":45,"No":10,"We do not formally reserve inventory":5}),
      freqScore("conflicts"),
      mscore("pull",{"Automatically from our inventory system":100,"Manually in a spreadsheet or document":65,"Written or printed manually":50,"Created from photos":40,"Communicated verbally":20,"We do not consistently use pull lists":0,"Other":35}),
      A.pull==="We do not consistently use pull lists"?0:processStepScore("pulldata",["Item name","Item ID","Photo","Quantity","Warehouse location","Room assignment","Project information"])
    ]),
    "Picking & Loading":avgKnown([
      mscore("pick",{"Items are scanned":100,"Items are checked against a digital list":70,"Items are checked against a printed list":55,"Designer or manager visually confirms":45,"Warehouse staff rely on experience":25,"There is no formal confirmation step":5,"It varies":30}),
      mscore("vehicle",{"Yes, in real time":100,"Yes, but only through manual records":50,"Sometimes":30,"No":5,"We do not need to track this today":55}),
      mscore("arrival",{"Almost never":100,"A few times per year":80,"Monthly":40,"Weekly":15,"Several times per week":5,"I do not know":45})
    ]),
    "Install & Return Control":avgKnown([
      processStepScore("install",["Inventory is scanned or digitally confirmed","Items are checked off a list","Photos are taken","Room assignments are recorded","Changes and substitutions are documented"],["Nothing is formally recorded"]),
      mscore("changes",{"Always":100,"Usually":75,"Sometimes":45,"Rarely":20,"Never":5,"We do not currently track that level of detail":5}),
      mscore("retrieve",{"Yes, generated from what was actually installed":100,"Yes, but the list is manually maintained":70,"Usually":65,"Sometimes":35,"No":5,"We rely mostly on the crew or designer knowing what belongs to us":10}),
      freqScore("missing"),
      mscore("return",{"Every item is inspected before becoming available again":100,"Most items are inspected":75,"Only obviously damaged items are inspected":40,"Items are generally put away immediately":5,"It depends on who handles the return":25})
    ]),
    "Team & Handoffs":avgKnown([
      mscore("responsibility",{"Very clear. Each role has defined responsibilities.":100,"Mostly clear, with some overlap.":78,"Responsibilities depend on the project.":50,"Several people handle the same work without defined ownership.":28,"Most inventory knowledge and decisions depend on one or two people.":18,"We do not have defined inventory responsibilities.":5}),
      mscore("coverage",{"Easily. The process and information are documented.":100,"Usually, with some questions.":75,"It depends on the task.":50,"It is difficult without the usual person.":22,"Certain inventory processes stop until that person is available.":5}),
      mscore("handoffconfirm",{"The system records the handoff automatically":100,"The receiving person digitally confirms it":90,"Someone checks off a list":75,"A manager or supervisor confirms it":65,"The teams communicate verbally":35,"Completion is assumed unless there is a problem":15,"There is no formal confirmation":5,"It varies":30}),
      freqScore("handofffreq"),
      mscore("handofftrace",{"Very easy. We have a clear record of each step.":100,"Usually easy":78,"Possible, but requires checking several places or asking people":45,"Difficult":20,"We mostly rely on people's memory":10,"We usually cannot determine exactly what happened":5}),
      Number.isFinite(Number(A.handoffowner))?(Number(A.handoffowner)-1)*25:null
    ]),
    "Condition Management":avgKnown([
      processStepScore("receiving",["Condition is inspected","Photos are taken","Shipping damage is documented"]),
      processStepScore("maintenance",["Inventory software","Spreadsheet","Task management system"],["We do not have a consistent process"]),
      mscore("history",{"Yes":100,"For some items":60,"Only if we search through records":35,"No":10,"We do not currently track this":5})
    ]),
    "Financial & Lifecycle":avgKnown([
      mscore("entry",{"When the order is placed":100,"When the item ships":90,"When the item arrives":75,"When someone has time to enter it":35,"It varies":25,"We do not formally enter new purchases into an inventory system":5}),
      mscore("trace",{"Very easily":100,"Usually":78,"Sometimes":50,"Rarely":22,"We generally cannot":5,"I am not sure":30}),
      processStepScore("financial",["Original purchase price","Purchase date","Replacement cost","Number of projects it has been used on","Total time it has spent staged","Cleaning costs","Repair costs","Current condition","Current location","Sale or disposal information"],["None of these consistently"]),
      processStepScore("retire",["Condition","Age","Style trends","Repair cost","Lack of use","Storage constraints","Financial data"],["We do not have a defined process"])
    ]),
    "Billing & Revenue Control":avgKnown([
      mscore("billing_terms",{"Automatically in a system":100,"Recorded in a system or calendar and reviewed manually":75,"Spreadsheet":60,"Paper notes":30,"Team knowledge or memory":15,"We do not track this consistently":5}),
      mscore("billing_trigger",{"The system creates or triggers it automatically":100,"A scheduled task or reminder prompts someone":78,"Someone reviews dates and bills manually":50,"The client or realtor reminds us":15,"Someone remembers to check":12,"There is no consistent trigger":5}),
      mscore("billing_status",{"In real time, in one system":100,"Usually, with a quick review":78,"Possible, but requires checking more than one place":45,"Difficult":20,"We mostly rely on memory or manual follow-up":10,"We do not have a consistent payment-status record":5}),
      mscore("payment_recon",{"Automatically or directly through our accounting/payment system":100,"Manually, but through one consistent reconciliation process":75,"Manually by checking bank or payment activity against records":50,"Only when something looks unpaid":20,"It varies by payment method or person":25,"We do not have a consistent reconciliation process":5}),
      freqScore("billing_misses"),
      mscore("extra_charges",{"Always, through a defined process":100,"Usually":75,"Sometimes":45,"Rarely":20,"There is no consistent process":5,"These charges do not apply to our business":null})
    ]),
    "Operational Visibility":avgKnown([
      Number.isFinite(Number(A.confidence))?(Number(A.confidence)-1)*25:null,
      systemsMaturity()
    ])
  };
  const overall=avgKnown(Object.values(categories));
  let level,summary;
  if(overall>=85){level="Optimized";summary="Your operation has strong control and visibility. The next opportunity is using reliable data to improve utilization, forecasting, purchasing, and capacity."}
  else if(overall>=70){level="Controlled";summary="Your core processes are working, with a few areas where stronger automation or traceability could reduce manual work and revenue risk."}
  else if(overall>=55){level="Structured";summary="You have useful processes in place, but important parts still depend on manual updates, separate records, or individual follow-up."}
  else if(overall>=40){level="Developing";summary="Your operation has working practices, but gaps in tracking, handoffs, billing, or real-time visibility can create avoidable labor, errors, and lost revenue."}
  else {level="Reactive";summary="Core operational control depends heavily on manual work, memory, or disconnected records. Establishing reliable tracking and ownership should come before advanced automation."}
  return {overall,level,summary,categories};
};

// ----- Voice recorder safety -----
record=async function(id){
  const b=document.querySelector("#recBtn");
  if(recorder&&recorder.state==="recording"){recorder.stop();return}
  if(!navigator.mediaDevices||!window.MediaRecorder){err("Audio recording is not supported in this browser.");return}
  try{
    const stream=await navigator.mediaDevices.getUserMedia({audio:true});
    chunks=[];
    recorder=new MediaRecorder(stream);
    recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};
    recorder.onstart=()=>{
      if(b){b.classList.add("active");b.textContent="■ Stop Recording"}
      const panel=document.querySelector("#voicePanel"),status=document.querySelector("#vstatus");
      if(panel)panel.classList.remove("hidden");
      if(status)status.textContent="Recording…";
      timer=setTimeout(()=>{if(recorder?.state==="recording")recorder.stop()},120000)
    };
    recorder.onstop=()=>{
      clearTimeout(timer);stream.getTracks().forEach(t=>t.stop());
      const blob=new Blob(chunks,{type:recorder.mimeType||"audio/webm"}),url=URL.createObjectURL(blob);
      if(notes[id]?.url)URL.revokeObjectURL(notes[id].url);
      notes[id]={blob,url,type:blob.type,at:new Date().toISOString()};
      const status=document.querySelector("#vstatus"),audio=document.querySelector("#audio"),btn=document.querySelector("#recBtn");
      if(status)status.textContent="Recorded";
      if(audio)audio.innerHTML=`<audio controls src="${url}"></audio>`;
      if(btn){btn.classList.remove("active");btn.textContent="🎤 Record Again"}
      recorder=null;saveLocal();
    };
    recorder.start();
  }catch(e){err("Microphone access was not granted. Voice recording should be tested again on the hosted HTTPS version.")}
};
