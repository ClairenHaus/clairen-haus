<script id="v5-final-hardening">
const V5_STATE_KEY="home_staging_operations_assessment_v5";
const V5_DB_NAME="home_staging_operations_assessment_voice";
const V5_DB_STORE="voice_notes";
let V5_COMPLETED=false;
let V5_SUBMITTED=false;
let V5_LAST_RESULTS=null;

// Local/sandbox/localhost should never submit.
// Any normal HTTPS deployment can submit.
function isLiveHostedEnvironment(){
  const protocol=window.location.protocol;
  const host=(window.location.hostname||"").toLowerCase();
  if(protocol!=="https:") return false;
  if(!host || host==="localhost" || host==="127.0.0.1" || host==="0.0.0.0") return false;
  if(window.location.origin==="null") return false;
  return true;
}
const V5_CAN_SUBMIT=isLiveHostedEnvironment();

// Remove standalone section-intro screens.
// Keep the section context on the first question in each section.
rebuild=function(){
  steps=[];
  S.forEach((section,si)=>{
    section[2].forEach(q=>{
      if(!q.show||q.show()) steps.push({k:"q",si,q});
    });
  });
};

function isFirstVisibleQuestionInSection(si,qid){
  const qs=S[si][2].filter(q=>!q.show||q.show());
  return qs.length>0 && qs[0].id===qid;
}

question=function(si,q){
  let b=q.t==="lead"?lead()
    :q.t==="single"?single(q,q.o)
    :q.t==="multi"?multi(q,q.o)
    :q.t==="dynamicMulti"?multi(q,dyn(q))
    :q.t==="dynamicSingle"?single(q,dyn(q))
    :q.t==="scale"?scale(q)
    :q.t==="counts"?counts()
    :long(q);

  const sectionDesc=S[si][1];
  const context=isFirstVisibleQuestionInSection(si,q.id)&&sectionDesc
    ? `<div class=section-context>${esc(sectionDesc)}</div>`:"";

  document.querySelector("#card").innerHTML=`
    <div class=eyebrow>${esc(S[si][0])}</div>
    ${context}
    <h2>${esc(q.q)} ${q.req&&!q.optional?'<span class=req>*</span>':''}</h2>
    ${q.h?`<div class=helper>${esc(q.h)}</div>`:""}
    ${b}
    <div id=error class="error hidden" role=alert aria-live=assertive></div>
    <div class=nav>
      <button class="btn secondary" onclick=back()>Back</button>
      <button class="btn primary" onclick=next()>Continue</button>
    </div>`;
  bind(q);
};

// ----- Completed-state persistence -----
function v5SerializableState(){
  return {
    answers:A,
    idx,
    completed:V5_COMPLETED,
    submitted:V5_SUBMITTED,
    submissionId:window.__submissionId||window.__lastSubmissionId||null,
    lastResults:V5_LAST_RESULTS,
    savedAt:new Date().toISOString()
  };
}
saveLocal=function(){
  try{
    localStorage.setItem(V5_STATE_KEY,JSON.stringify(v5SerializableState()));
  }catch(e){}
};
readLocal=function(){
  try{
    const raw=localStorage.getItem(V5_STATE_KEY);
    return raw?JSON.parse(raw):null;
  }catch(e){return null}
};
clearLocal=function(){
  try{localStorage.removeItem(V5_STATE_KEY)}catch(e){}
};
hasMeaningfulSavedState=function(){
  const s=readLocal();
  return !!(s&&s.answers&&Object.keys(s.answers).length);
};

async function restoreLocalV5(){
  const s=readLocal();
  if(!s||!s.answers)return false;
  A=s.answers||{};
  V5_COMPLETED=!!s.completed;
  V5_SUBMITTED=!!s.submitted;
  V5_LAST_RESULTS=s.lastResults||null;
  window.__submissionId=s.submissionId||null;
  window.__lastSubmissionId=s.submissionId||null;
  sanitizeBranches();
  await restoreVoiceNotes();
  rebuild();
  idx=V5_COMPLETED?steps.length:Math.min(Math.max(Number(s.idx)||0,0),Math.max(0,steps.length-1));
  return true;
}

// ----- IndexedDB voice note persistence -----
function openVoiceDB(){
  return new Promise((resolve,reject)=>{
    const req=indexedDB.open(V5_DB_NAME,1);
    req.onupgradeneeded=()=>{
      const db=req.result;
      if(!db.objectStoreNames.contains(V5_DB_STORE)) db.createObjectStore(V5_DB_STORE,{keyPath:"id"});
    };
    req.onsuccess=()=>resolve(req.result);
    req.onerror=()=>reject(req.error);
  });
}
async function saveVoiceNoteToDB(id,note){
  try{
    const db=await openVoiceDB();
    await new Promise((resolve,reject)=>{
      const tx=db.transaction(V5_DB_STORE,"readwrite");
      tx.objectStore(V5_DB_STORE).put({id,blob:note.blob,type:note.type,at:note.at});
      tx.oncomplete=()=>resolve();
      tx.onerror=()=>reject(tx.error);
    });
    db.close();
  }catch(e){console.warn("Voice-note recovery save failed",e)}
}
async function restoreVoiceNotes(){
  try{
    const db=await openVoiceDB();
    const rows=await new Promise((resolve,reject)=>{
      const tx=db.transaction(V5_DB_STORE,"readonly");
      const req=tx.objectStore(V5_DB_STORE).getAll();
      req.onsuccess=()=>resolve(req.result||[]);
      req.onerror=()=>reject(req.error);
    });
    Object.values(notes).forEach(n=>n.url&&URL.revokeObjectURL(n.url));
    notes={};
    rows.forEach(row=>{
      const url=URL.createObjectURL(row.blob);
      notes[row.id]={blob:row.blob,url,type:row.type,at:row.at};
    });
    db.close();
  }catch(e){console.warn("Voice-note recovery restore failed",e)}
}
async function deleteVoiceNoteFromDB(id){
  try{
    const db=await openVoiceDB();
    await new Promise((resolve,reject)=>{
      const tx=db.transaction(V5_DB_STORE,"readwrite");
      tx.objectStore(V5_DB_STORE).delete(id);
      tx.oncomplete=()=>resolve();
      tx.onerror=()=>reject(tx.error);
    });
    db.close();
  }catch(e){}
}
async function clearVoiceDB(){
  try{
    const db=await openVoiceDB();
    await new Promise((resolve,reject)=>{
      const tx=db.transaction(V5_DB_STORE,"readwrite");
      tx.objectStore(V5_DB_STORE).clear();
      tx.oncomplete=()=>resolve();
      tx.onerror=()=>reject(tx.error);
    });
    db.close();
  }catch(e){}
}

deleteNote=async function(id){
  if(notes[id]?.url)URL.revokeObjectURL(notes[id].url);
  delete notes[id];
  await deleteVoiceNoteFromDB(id);
  render();
};

// Patch recorder to save audio blob to IndexedDB.
record=async function(id){
  const b=document.querySelector("#recBtn");
  if(recorder&&recorder.state==="recording"){recorder.stop();return}
  if(!navigator.mediaDevices||!window.MediaRecorder){err("Audio recording is not supported in this browser.");return}
  try{
    const stream=await navigator.mediaDevices.getUserMedia({audio:true});
    chunks=[];
    recorder=new MediaRecorder(stream);
    recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};
    recorder.onstart=()=>{
      if(b){b.classList.add("active");b.textContent="■ Stop Recording"}
      const panel=document.querySelector("#voicePanel"),status=document.querySelector("#vstatus");
      if(panel)panel.classList.remove("hidden");
      if(status)status.textContent="Recording…";
      timer=setTimeout(()=>{if(recorder?.state==="recording")recorder.stop()},120000)
    };
    recorder.onstop=async()=>{
      clearTimeout(timer);
      stream.getTracks().forEach(t=>t.stop());
      const blob=new Blob(chunks,{type:recorder.mimeType||"audio/webm"});
      const url=URL.createObjectURL(blob);
      if(notes[id]?.url)URL.revokeObjectURL(notes[id].url);
      notes[id]={blob,url,type:blob.type,at:new Date().toISOString()};
      await saveVoiceNoteToDB(id,notes[id]);
      const status=document.querySelector("#vstatus"),audio=document.querySelector("#audio"),btn=document.querySelector("#recBtn");
      if(status)status.textContent="Recorded";
      if(audio)audio.innerHTML=`<audio controls src="${url}"></audio>`;
      if(btn){btn.classList.remove("active");btn.textContent="🎤 Record Again"}
      recorder=null;
      saveLocal();
    };
    recorder.start();
  }catch(e){
    err("Microphone access was not granted. Voice recording should be tested on the hosted HTTPS version.");
  }
};

// ----- Receiving contradictions -----
EXCLUSIVE.receiving=["The item is simply put away"];
const _normalizeMultiV5=normalizeMulti;
normalizeMulti=function(qid,arr,chosen){
  let normalized=_normalizeMultiV5(qid,arr,chosen);
  if(qid==="receiving"){
    if(chosen==="The item is simply put away") return [chosen];
    normalized=normalized.filter(x=>x!=="The item is simply put away");
  }
  return normalized;
};

// Cap inconsistent receiving practice instead of allowing a perfect score.
function receivingConditionScore(){
  const a=A.receiving||[];
  if(a.includes("The item is simply put away"))return 5;
  const positive=["Condition is inspected","Photos are taken","Shipping damage is documented"];
  let score=fractionScore("receiving",positive);
  if(a.includes("It depends on who receives it")) score=Math.min(score,55);
  return score;
}

// Preserve explicit null values in score maps.
mscore=function(key,map,fallback=50){
  const value=A[key];
  if(Object.prototype.hasOwnProperty.call(map,value)) return map[value];
  return fallback;
};

// Patch the two category formulas that need the null/receiving fix.
// Keep all other v4 category logic.
const _calculateScoresV4=calculateScores;
calculateScores=function(){
  const result=_calculateScoresV4();

  result.categories["Condition Management"]=avgKnown([
    receivingConditionScore(),
    processStepScore("maintenance",["Inventory software","Spreadsheet","Task management system"],["We do not have a consistent process"]),
    mscore("history",{"Yes":100,"For some items":60,"Only if we search through records":35,"No":10,"We do not currently track this":5})
  ]);

  result.categories["Billing & Revenue Control"]=avgKnown([
    mscore("billing_terms",{"Automatically in a system":100,"Recorded in a system or calendar and reviewed manually":75,"Spreadsheet":60,"Paper notes":30,"Team knowledge or memory":15,"We do not track this consistently":5}),
    mscore("billing_trigger",{"The system creates or triggers it automatically":100,"A scheduled task or reminder prompts someone":78,"Someone reviews dates and bills manually":50,"The client or realtor reminds us":15,"Someone remembers to check":12,"There is no consistent trigger":5}),
    mscore("billing_status",{"In real time, in one system":100,"Usually, with a quick review":78,"Possible, but requires checking more than one place":45,"Difficult":20,"We mostly rely on memory or manual follow-up":10,"We do not have a consistent payment-status record":5}),
    mscore("payment_recon",{"Automatically or directly through our accounting/payment system":100,"Manually, but through one consistent reconciliation process":75,"Manually by checking bank or payment activity against records":50,"Only when something looks unpaid":20,"It varies by payment method or person":25,"We do not have a consistent reconciliation process":5}),
    mscore("billing_misses",{"Almost never":100,"A few times per year":85,"Monthly":45,"Weekly":20,"Several times per week":5,"I do not know":null}),
    mscore("extra_charges",{"Always, through a defined process":100,"Usually":75,"Sometimes":45,"Rarely":20,"There is no consistent process":5,"These charges do not apply to our business":null})
  ]);

  result.overall=avgKnown(Object.values(result.categories));
  if(result.overall>=85){result.level="Optimized";result.summary="Your operation has strong control and visibility. The next opportunity is using reliable data to improve utilization, forecasting, purchasing, and capacity."}
  else if(result.overall>=70){result.level="Controlled";result.summary="Your core processes are working, with a few areas where stronger automation or traceability could reduce manual work and revenue risk."}
  else if(result.overall>=55){result.level="Structured";result.summary="You have useful processes in place, but important parts still depend on manual updates, separate records, or individual follow-up."}
  else if(result.overall>=40){result.level="Developing";result.summary="Your operation has working practices, but gaps in tracking, handoffs, billing, or real-time visibility can create avoidable labor, errors, and lost revenue."}
  else {result.level="Reactive";result.summary="Core operational control depends heavily on manual work, memory, or disconnected records. Establishing reliable tracking and ownership should come before advanced automation."}
  return result;
};

// ----- Stable submission ID + retry-safe save -----
uploadVoiceNotes=async function(submissionId){
  const paths=[];
  for(const [questionId,note] of Object.entries(notes)){
    const extension=fileExt(note.type);
    const path=`${submissionId}/${questionId}.${extension}`;
    const res=await fetch(`${SUPABASE_URL}/storage/v1/object/${VOICE_BUCKET}/${path}`,{
      method:"POST",
      headers:{
        "apikey":SUPABASE_ANON_KEY,
        "Authorization":`Bearer ${SUPABASE_ANON_KEY}`,
        "Content-Type":note.type||"audio/webm",
        "x-upsert":"false"
      },
      body:note.blob
    });
    // 400/409 can mean this stable object already exists after an ambiguous prior attempt.
    if(!res.ok && ![400,409].includes(res.status)) throw new Error(`Voice upload failed (${res.status})`);
    paths.push({question_id:questionId,path,mime_type:note.type,recorded_at:note.at});
  }
  return paths;
};

saveAssessment=async function(scores,recs){
  const submissionId=window.__submissionId||crypto.randomUUID();
  window.__submissionId=submissionId;
  saveLocal();

  const voicePaths=await uploadVoiceNotes(submissionId);
  const payload={
    id:submissionId,
    respondent_name:A.name,
    company_name:A.company,
    email:A.email,
    phone:A.phone||null,
    website:A.website||null,
    overall_score:scores.overall,
    maturity_level:scores.level,
    category_scores:scores.categories,
    recommendations:recs,
    responses:{...A,_roi_inputs:estimateROIInputs()},
    voice_note_paths:voicePaths,
    completed_at:new Date().toISOString(),
    user_agent:navigator.userAgent
  };

  const res=await fetch(`${SUPABASE_URL}/rest/v1/staging_inventory_assessments?on_conflict=id`,{
    method:"POST",
    headers:{
      "apikey":SUPABASE_ANON_KEY,
      "Authorization":`Bearer ${SUPABASE_ANON_KEY}`,
      "Content-Type":"application/json",
      "Prefer":"resolution=merge-duplicates,return=minimal"
    },
    body:JSON.stringify(payload)
  });
  if(!res.ok){
    const body=await res.text();
    throw new Error(`Assessment save failed (${res.status}): ${body.slice(0,180)}`);
  }
  return submissionId;
};

persistResults=async function(scores,recs){
  const node=document.querySelector("#submitStatus"),retry=document.querySelector("#retryWrap");
  if(!node)return;

  if(!V5_CAN_SUBMIT){
    node.className="submit-status";
    node.textContent="Preview mode: results are available, but this test response was not sent to Supabase.";
    if(retry)retry.innerHTML="";
    return;
  }

  if(V5_SUBMITTED && (window.__lastSubmissionId||window.__submissionId)){
    node.className="submit-status ok";
    node.textContent="Assessment saved successfully. Reference: "+String(window.__lastSubmissionId||window.__submissionId).slice(0,8).toUpperCase();
    if(retry)retry.innerHTML="";
    return;
  }

  node.className="submit-status";
  node.textContent="Saving assessment responses…";
  if(retry)retry.innerHTML="";

  try{
    const id=await saveAssessment(scores,recs);
    window.__lastSubmissionId=id;
    V5_SUBMITTED=true;
    saveLocal();
    node.className="submit-status ok";
    node.textContent="Assessment saved successfully. Reference: "+id.slice(0,8).toUpperCase();
  }catch(e){
    V5_SUBMITTED=false;
    saveLocal();
    node.className="submit-status bad";
    node.textContent="Your results are available, but the submission could not be confirmed.";
    if(retry)retry.innerHTML=`<button class="btn secondary" style="margin-top:10px" onclick="retrySubmission()">Retry save</button>`;
    console.error(e);
  }
};

// ----- Completed assessment behavior -----
const _completeV5Base=complete;
complete=function(){
  V5_COMPLETED=true;
  const scores=calculateScores(),recs=recommendations(scores);
  V5_LAST_RESULTS={scores,recs};
  saveLocal();
  _completeV5Base();
  // The wrapped v4 complete writes local state again. Ensure completed state remains true.
  V5_COMPLETED=true;
  saveLocal();
};

welcome=function(){
  idx=-1;
  const saved=readLocal();
  const unfinished=!!(saved&&saved.answers&&Object.keys(saved.answers).length&&!saved.completed);
  const completed=!!(saved&&saved.answers&&saved.completed);

  document.querySelector("#card").innerHTML=`
    <div class=eyebrow>Home Staging Operations Diagnostic</div>
    <h1>How Well Can You See and Control Your Staging Operation?</h1>
    <p class=lead>This assessment looks at how inventory, projects, team handoffs, billing, payments, and asset lifecycle work move through your business today.</p>
    <p>The goal is to identify where manual work, limited visibility, inconsistent tracking, or missed follow-up may be creating unnecessary labor, errors, inventory risk, or lost revenue.</p>
    <p><b>Estimated time:</b> 15–20 minutes. Most questions are click-to-answer. Longer explanations are optional and can be dictated or recorded.</p>
    ${completed?`
      <div class=completed-box>
        <b>You have a completed assessment saved on this device.</b>
        <div class=completed-actions>
          <button class="btn primary" onclick="viewSavedResults()">View results</button>
          <button class="btn secondary" onclick="discardSaved()">Start a new assessment</button>
        </div>
      </div>`:
      unfinished?`
      <div class=resume-box>
        <b>You have an unfinished assessment saved on this device.</b>
        <div class=resume-actions>
          <button class="btn primary" onclick="resumeAssessment()">Resume assessment</button>
          <button class="btn secondary" onclick="discardSaved()">Start over</button>
        </div>
      </div>`:
      `<div class=nav><span></span><button class="btn primary" onclick=start()>Start Assessment</button></div>`}
  `;
  const bar=document.querySelector("#bar");if(bar)bar.style.width="0%";
  document.querySelector("#pcopy").textContent="Ready to begin";
  if(progressNode)progressNode.setAttribute("aria-valuenow","0");
};

resumeAssessment=async function(){
  if(await restoreLocalV5()){
    if(V5_COMPLETED) complete(); else render();
  }else start();
};
viewSavedResults=async function(){
  if(await restoreLocalV5()){
    V5_COMPLETED=true;
    complete();
  }
};
discardSaved=async function(){
  clearLocal();
  await clearVoiceDB();
  Object.values(notes).forEach(n=>n.url&&URL.revokeObjectURL(n.url));
  A={};notes={};idx=-1;V5_COMPLETED=false;V5_SUBMITTED=false;V5_LAST_RESULTS=null;
  window.__submissionId=null;window.__lastSubmissionId=null;
  welcome();
};

restart=async function(){
  if(!confirm("Start a new assessment? Current browser responses will be cleared."))return;
  await discardSaved();
};

// Path-position progress with no intro screens.
progress=function(){
  rebuild();
  const total=steps.length;
  let current=Math.max(0,idx);
  let p=idx<0?0:Math.round((current/Math.max(1,total))*100);
  p=Math.max(0,Math.min(99,p));
  const bar=document.querySelector("#bar");
  if(bar)bar.style.width=p+"%";
  const copy=document.querySelector("#pcopy");
  if(copy)copy.textContent=idx<0?"Ready to begin":p+"% complete";
  if(progressNode)progressNode.setAttribute("aria-valuenow",String(p));
};

// Initialize from v5 state only.
try{
  localStorage.removeItem("home_staging_operations_assessment_v4");
  localStorage.removeItem("home_staging_inventory_assessment_v4");
}catch(e){}
rebuild();
setTimeout(()=>welcome(),20);
</script>


<script id="v6-deployment-hardening">
/*
  Deployment safety:
  - TEST build: SUBMISSION_MODE = "test"
  - Production template: SUBMISSION_MODE = "production"
  - Production still requires the exact hostname to appear in PRODUCTION_HOSTS.
*/
const SUBMISSION_MODE = "production";
const PRODUCTION_HOSTS = [];

function canSubmitToProduction(){
  if(SUBMISSION_MODE!=="production") return false;
  if(window.location.protocol!=="https:") return false;
  const host=(window.location.hostname||"").toLowerCase();
  return PRODUCTION_HOSTS.map(h=>String(h).toLowerCase()).includes(host);
}

// Clear voice recordings when their conditional question becomes hidden.
const __sanitizeBranchesV6Base = sanitizeBranches;
sanitizeBranches = function(){
  __sanitizeBranchesV6Base();

  const hiddenVoiceIds=[];

  if(!A.riskhandoff || ["No particular handoff stands out","I am not sure"].includes(A.riskhandoff)){
    hiddenVoiceIds.push("riskexplain");
  }

  if(A.problem!=="Yes"){
    hiddenVoiceIds.push("problemtext");
  }

  hiddenVoiceIds.forEach(id=>{
    if(notes[id]?.url){
      try{URL.revokeObjectURL(notes[id].url)}catch(e){}
    }
    if(notes[id]) delete notes[id];
    // IndexedDB cleanup is intentionally fire-and-forget so answer changes stay instant.
    Promise.resolve(deleteVoiceNoteFromDB(id)).catch(()=>{});
  });
};

// Upload voice notes safely.
// 409 is treated as duplicate.
// 400 is only treated as duplicate when Supabase explicitly says the object already exists.
uploadVoiceNotes = async function(submissionId){
  const paths=[];

  for(const [questionId,note] of Object.entries(notes)){
    const extension=fileExt(note.type);
    const path=`${submissionId}/${questionId}.${extension}`;

    const res=await fetch(`${SUPABASE_URL}/storage/v1/object/${VOICE_BUCKET}/${path}`,{
      method:"POST",
      headers:{
        "apikey":SUPABASE_ANON_KEY,
        "Authorization":`Bearer ${SUPABASE_ANON_KEY}`,
        "Content-Type":note.type||"audio/webm",
        "x-upsert":"false"
      },
      body:note.blob
    });

    if(!res.ok){
      const responseText=await res.text();
      const duplicate400 =
        res.status===400 &&
        /already exists|duplicate|resource exists|object exists/i.test(responseText);

      const duplicate409 = res.status===409;

      if(!duplicate400 && !duplicate409){
        throw new Error(`Voice upload failed (${res.status}): ${responseText.slice(0,220)}`);
      }
    }

    paths.push({
      question_id:questionId,
      path,
      mime_type:note.type,
      recorded_at:note.at
    });
  }

  return paths;
};

// Submission now uses explicit mode + exact production hostname allowlist.
persistResults = async function(scores,recs){
  const node=document.querySelector("#submitStatus");
  const retry=document.querySelector("#retryWrap");
  if(!node)return;

  if(!canSubmitToProduction()){
    node.className="submit-status";
    node.textContent=
      SUBMISSION_MODE==="production"
        ? "Submission is disabled on this hostname. Results are available, but this response was not sent to Supabase."
        : "Test mode: results are available, but this response was not sent to Supabase.";
    if(retry)retry.innerHTML="";
    return;
  }

  if(V5_SUBMITTED && (window.__lastSubmissionId||window.__submissionId)){
    node.className="submit-status ok";
    node.textContent="Assessment saved successfully. Reference: "+
      String(window.__lastSubmissionId||window.__submissionId).slice(0,8).toUpperCase();
    if(retry)retry.innerHTML="";
    return;
  }

  node.className="submit-status";
  node.textContent="Saving assessment responses…";
  if(retry)retry.innerHTML="";

  try{
    const id=await saveAssessment(scores,recs);
    window.__lastSubmissionId=id;
    V5_SUBMITTED=true;
    saveLocal();

    node.className="submit-status ok";
    node.textContent="Assessment saved successfully. Reference: "+
      id.slice(0,8).toUpperCase();
  }catch(e){
    V5_SUBMITTED=false;
    saveLocal();

    node.className="submit-status bad";
    node.textContent="Your results are available, but the submission could not be confirmed.";

    if(retry){
      retry.innerHTML=
        `<button class="btn secondary" style="margin-top:10px" onclick="retrySubmission()">Retry save</button>`;
    }
    console.error(e);
  }
};

// Ensure hidden-branch audio is pruned before every save/export.
const __saveAssessmentV6Base=saveAssessment;
saveAssessment=async function(scores,recs){
  sanitizeBranches();
  return await __saveAssessmentV6Base(scores,recs);
};

const __downloadV6Base=download;
download=function(){
  sanitizeBranches();
  return __downloadV6Base();
};
</script>


<script id="v7-diagnostic-calibration">
const V7_STATE_KEY="home_staging_operations_assessment_v7_schema1";
const V7_DB_NAME="home_staging_operations_assessment_voice_v7";

// ---------- Scope and question cleanup ----------
(function v7QuestionCleanup(){
  const team=S.find(s=>s[0]==="Team Handoffs and Accountability");
  if(team){
    // Remove duplicate ownership scale. The responsibility question remains.
    team[2]=team[2].filter(q=>q.id!=="handoffowner");
  }

  const gaps=S.find(s=>s[0]==="Biggest Operational Gaps");
  if(gaps){
    // Remove the redundant yes/no + explanation branch. Final Priority retains open explanation/voice.
    gaps[2]=gaps[2].filter(q=>!["problem","problemtext"].includes(q.id));

    const friction=gaps[2].find(q=>q.id==="friction");
    if(friction) friction.q="Which issues create the most friction in your current staging operation?";

    const outcome=gaps[2].find(q=>q.id==="outcome");
    if(outcome) outcome.q="Which outcome would make the biggest difference to your staging operation?";
  }

  const final=S.find(s=>s[0]==="Final Priority");
  if(final){
    final[1]="This final section identifies the one operational problem you would most want solved first.";
    const q=final[2].find(q=>q.id==="priority");
    if(q) q.q="If you could fix one staging operations problem first, what would it be?";
  }

  const readiness=S.find(s=>s[0]==="Implementation Readiness");
  if(readiness){
    const q=readiness[2].find(q=>q.id==="start_timing");
    if(q) q.q="If you decided to improve your staging operation, when would you ideally want to begin?";
  }
})();

// ---------- Build-versioned browser recovery ----------
saveLocal=function(){
  try{
    localStorage.setItem(V7_STATE_KEY,JSON.stringify({
      answers:A,
      idx,
      completed:V5_COMPLETED,
      submitted:V5_SUBMITTED,
      submissionId:window.__submissionId||window.__lastSubmissionId||null,
      lastResults:V5_LAST_RESULTS,
      savedAt:new Date().toISOString()
    }));
  }catch(e){}
};

readLocal=function(){
  try{
    const raw=localStorage.getItem(V7_STATE_KEY);
    return raw?JSON.parse(raw):null;
  }catch(e){return null}
};

clearLocal=function(){
  try{localStorage.removeItem(V7_STATE_KEY)}catch(e){}
};

openVoiceDB=function(){
  return new Promise((resolve,reject)=>{
    const req=indexedDB.open(V7_DB_NAME,1);
    req.onupgradeneeded=()=>{
      const db=req.result;
      if(!db.objectStoreNames.contains(V5_DB_STORE)){
        db.createObjectStore(V5_DB_STORE,{keyPath:"id"});
      }
    };
    req.onsuccess=()=>resolve(req.result);
    req.onerror=()=>reject(req.error);
  });
};

// ---------- Stable progress based on the full questionnaire order ----------
progress=function(){
  rebuild();
  const allQs=S.flatMap(section=>section[2]);
  const current=steps[idx]?.q;
  let p=0;

  if(idx>=0 && current){
    const ordinal=allQs.findIndex(q=>q.id===current.id);
    p=Math.round(Math.max(0,ordinal)/Math.max(1,allQs.length)*100);
    p=Math.min(99,Math.max(0,p));
  }

  const bar=document.querySelector("#bar");
  if(bar) bar.style.width=p+"%";

  const copy=document.querySelector("#pcopy");
  if(copy) copy.textContent=idx<0?"Ready to begin":p+"% complete";

  if(progressNode) progressNode.setAttribute("aria-valuenow",String(p));
};

// ---------- Mixed-answer controls ----------
EXCLUSIVE.install=["Nothing is formally recorded"];

const __normalizeMultiV7Base=normalizeMulti;
normalizeMulti=function(qid,arr,chosen){
  let result=__normalizeMultiV7Base(qid,arr,chosen);

  if(qid==="install"){
    if(chosen==="Nothing is formally recorded") return [chosen];
    result=result.filter(x=>x!=="Nothing is formally recorded");
  }

  return result;
};

// ---------- Scoring helpers ----------
function v7Avg(values){
  const xs=values.filter(v=>Number.isFinite(v));
  return xs.length?Math.round(xs.reduce((a,b)=>a+b,0)/xs.length):0;
}

trackingScore=function(){
  const a=A.tracking||[];
  if(a.includes("We do not have a consistent inventory record")) return 5;

  if(a.includes("Inventory management software")){
    let score=100;
    if(a.includes("Paper records")) score-=8;
    if(a.includes("Notes on phones")) score-=10;
    if(a.includes("Team knowledge or memory")) score-=12;
    return Math.max(65,score);
  }

  if(a.includes("Spreadsheet")){
    let score=65;
    if(a.includes("Photos or photo folders")) score-=8;
    if(a.includes("Paper records")) score-=12;
    if(a.includes("Notes on phones")) score-=12;
    if(a.includes("Team knowledge or memory")) score-=15;
    return Math.max(20,score);
  }

  if(a.includes("Accounting system")){
    let score=52;
    if(a.includes("Paper records")) score-=8;
    if(a.includes("Team knowledge or memory")) score-=12;
    return Math.max(20,score);
  }

  const scores=[];
  if(a.includes("Photos or photo folders")) scores.push(38);
  if(a.includes("Labels or handwritten tags")) scores.push(35);
  if(a.includes("Paper records")) scores.push(28);
  if(a.includes("Notes on phones")) scores.push(22);
  if(a.includes("Team knowledge or memory")) scores.push(15);
  if(a.includes("Other")) scores.push(35);

  return scores.length?v7Avg(scores):25;
};

function v7MaintenanceScore(){
  const a=A.maintenance||[];
  if(a.includes("We do not have a consistent process")) return 5;
  if(a.includes("Inventory software")) return 100;
  if(a.includes("Task management system")) return 85;
  if(a.includes("Spreadsheet")) return 60;
  if(a.includes("Physical area or pile in the warehouse")) return 45;
  if(a.includes("Paper notes")) return 35;
  if(a.some(x=>["Text messages","Group chat","Email"].includes(x))) return 30;
  if(a.includes("Team memory")) return 15;
  return 35;
}

function v7InstallRecordingScore(){
  const a=A.install||[];
  if(a.includes("Nothing is formally recorded")) return 5;

  const positives=[
    "Inventory is scanned or digitally confirmed",
    "Items are checked off a list",
    "Photos are taken",
    "Room assignments are recorded",
    "Changes and substitutions are documented"
  ];
  const hits=positives.filter(x=>a.includes(x)).length;
  let score=Math.round(hits/positives.length*100);

  if(a.includes("The designer knows what was installed")) score=Math.min(score||25,60);
  if(a.includes("It varies")) score=Math.min(score||30,60);

  return score||25;
}

function v7HandoffCommunicationScore(){
  const a=A.handoffcomm||[];
  if(a.includes("There is no consistent handoff process")) return 5;

  const map={
    "Inventory or project management system":100,
    "Digital checklist":90,
    "Spreadsheet":65,
    "Printed paperwork":55,
    "Email":45,
    "Text message":40,
    "Team chat":45,
    "Phone call":35,
    "Verbal conversation":30,
    "Photos":45,
    "The next person generally knows what to do":25,
    "Other":40
  };

  const vals=a.map(x=>map[x]).filter(Number.isFinite);
  let score=vals.length?Math.max(...vals):35;

  if(a.includes("It varies by project")) score=Math.min(score,55);
  return score;
}

function v7HandoffProblemScore(){
  const a=A.handoffproblems||[];
  if(a.includes("We rarely experience handoff problems")) return 100;
  const count=a.filter(x=>x!=="Other").length;
  if(count<=1) return 75;
  if(count<=3) return 55;
  if(count<=6) return 35;
  return 15;
}

function v7FinancialVisibilityScore(){
  const a=A.financial||[];
  if(a.includes("None of these consistently")) return 5;
  const known=[
    "Original purchase price","Purchase date","Replacement cost",
    "Number of projects it has been used on","Total time it has spent staged",
    "Cleaning costs","Repair costs","Current condition","Current location",
    "Sale or disposal information"
  ].filter(x=>a.includes(x)).length;

  if(known>=9) return 100;
  if(known>=6) return 82;
  if(known>=3) return 60;
  if(known>=1) return 38;
  return 15;
}

function v7RetirementScore(){
  const a=A.retire||[];
  if(a.includes("We do not have a defined process")) return 5;

  const substantive=[
    "Condition","Age","Style trends","Repair cost","Lack of use",
    "Storage constraints","Designer recommendation","Owner judgment","Financial data"
  ].filter(x=>a.includes(x));

  let score= substantive.length>=6 ? 90 :
             substantive.length>=4 ? 80 :
             substantive.length>=2 ? 65 :
             substantive.length===1 ? 45 : 25;

  if(a.includes("Repair cost")) score+=5;
  if(a.includes("Financial data")) score+=5;
  return Math.min(100,score);
}

function v7ProjectSelectionScore(){
  const a=A.select||[];
  if(a.includes("Inventory software")) return 100;

  let score=25;
  if(a.includes("Spreadsheet or list")) score=Math.max(score,58);
  if(a.includes("Previous project references")) score=Math.max(score,48);
  if(a.includes("Photos")) score=Math.max(score,45);
  if(a.includes("Physical warehouse walkthrough")) score=Math.max(score,40);
  if(a.includes("Paper notes")) score=Math.max(score,30);
  if(a.includes("Designer memory")||a.includes("Warehouse team knowledge")) score=Math.min(Math.max(score,25),55);

  return score;
}

function v7PullScore(){
  return mscore("pull",{
    "Automatically from our inventory system":100,
    "Manually in a spreadsheet or document":55,
    "Written or printed manually":45,
    "Created from photos":35,
    "Communicated verbally":15,
    "We do not consistently use pull lists":0,
    "Other":30
  },30);
}

// ---------- Recalibrated category calculation ----------
const __calculateScoresV7Base=calculateScores;
calculateScores=function(){
  const result=__calculateScoresV7Base();

  result.categories["Inventory Control"]=v7Avg([
    trackingScore(),
    mscore("documented",{
      "Nearly all of it":100,"Most of it":80,"About half":55,
      "Some of it":30,"Very little":10,"I do not know":null
    }),
    mscore("ids",{
      "Yes, almost everything":100,"Yes, but only certain items":65,
      "No":10,"I am not sure":null
    }),
    processStepScore(
      "fields",
      ["Photo","Item name or description","Category","Dimensions","Purchase date","Purchase cost","Current location","Current project","Availability","Condition"],
      ["None of these consistently"]
    )
  ]);

  result.categories["Project Allocation"]=v7Avg([
    v7ProjectSelectionScore(),
    mscore("reserve",{
      "Yes, in real time":100,"Usually":75,"Sometimes":45,
      "No":10,"We do not formally reserve inventory":5
    }),
    mscore("conflicts",{
      "Almost never":100,"A few times per year":78,"Monthly":40,
      "Weekly":15,"Several times per week":5,"I do not know":null
    }),
    v7PullScore(),
    A.pull==="We do not consistently use pull lists"
      ? 0
      : processStepScore("pulldata",["Item name","Item ID","Photo","Quantity","Warehouse location","Room assignment","Project information"])
  ]);

  result.categories["Install & Return Control"]=v7Avg([
    v7InstallRecordingScore(),
    mscore("changes",{
      "Always":100,"Usually":75,"Sometimes":45,"Rarely":20,
      "Never":5,"We do not currently track that level of detail":5
    }),
    mscore("retrieve",{
      "Yes, generated from what was actually installed":100,
      "Yes, but the list is manually maintained":68,
      "Usually":62,"Sometimes":35,"No":5,
      "We rely mostly on the crew or designer knowing what belongs to us":10
    }),
    mscore("missing",{
      "Almost never":100,"A few times per year":80,"Monthly":40,
      "Weekly":15,"Several times per week":5,"I do not know":null
    }),
    mscore("return",{
      "Every item is inspected before becoming available again":100,
      "Most items are inspected":75,
      "Only obviously damaged items are inspected":40,
      "Items are generally put away immediately":5,
      "It depends on who handles the return":25
    })
  ]);

  result.categories["Team & Handoffs"]=v7Avg([
    mscore("responsibility",{
      "Very clear. Each role has defined responsibilities.":100,
      "Mostly clear, with some overlap.":78,
      "Responsibilities depend on the project.":50,
      "Several people handle the same work without defined ownership.":28,
      "Most inventory knowledge and decisions depend on one or two people.":18,
      "We do not have defined inventory responsibilities.":5
    }),
    mscore("coverage",{
      "Easily. The process and information are documented.":100,
      "Usually, with some questions.":75,"It depends on the task.":50,
      "It is difficult without the usual person.":22,
      "Certain inventory processes stop until that person is available.":5
    }),
    v7HandoffCommunicationScore(),
    mscore("handoffconfirm",{
      "The system records the handoff automatically":100,
      "The receiving person digitally confirms it":90,
      "Someone checks off a list":75,
      "A manager or supervisor confirms it":65,
      "The teams communicate verbally":35,
      "Completion is assumed unless there is a problem":15,
      "There is no formal confirmation":5,
      "It varies":30
    }),
    mscore("handofffreq",{
      "Almost never":100,"A few times per year":82,"Monthly":45,
      "Weekly":20,"Several times per week":5,"I do not know":null
    }),
    v7HandoffProblemScore(),
    mscore("handofftrace",{
      "Very easy. We have a clear record of each step.":100,
      "Usually easy":78,
      "Possible, but requires checking several places or asking people":45,
      "Difficult":20,"We mostly rely on people's memory":10,
      "We usually cannot determine exactly what happened":5
    })
  ]);

  result.categories["Condition Management"]=v7Avg([
    receivingConditionScore(),
    v7MaintenanceScore(),
    mscore("history",{
      "Yes":100,"For some items":60,
      "Only if we search through records":35,
      "No":10,"We do not currently track this":5
    })
  ]);

  result.categories["Financial & Lifecycle"]=v7Avg([
    mscore("entry",{
      "When the order is placed":100,"When the item ships":90,
      "When the item arrives":75,"When someone has time to enter it":35,
      "It varies":25,"We do not formally enter new purchases into an inventory system":5
    }),
    mscore("trace",{
      "Very easily":100,"Usually":78,"Sometimes":50,
      "Rarely":22,"We generally cannot":5,"I am not sure":null
    }),
    v7FinancialVisibilityScore(),
    v7RetirementScore()
  ]);

  const rawOverall=v7Avg(Object.values(result.categories));
  const minimum=Math.min(...Object.values(result.categories));

  // Critical-category cap: a very strong average cannot mask a materially weak core area.
  let adjustedOverall=rawOverall;
  if(rawOverall>=85 && minimum<50) adjustedOverall=Math.min(adjustedOverall,84);
  if(rawOverall>=70 && minimum<40) adjustedOverall=Math.min(adjustedOverall,69);
  if(rawOverall>=55 && minimum<25) adjustedOverall=Math.min(adjustedOverall,54);

  result.rawOverall=rawOverall;
  result.minimumCategory=minimum;
  result.overall=adjustedOverall;
  result.gated=adjustedOverall!==rawOverall;

  if(adjustedOverall>=85 && minimum>=70){
    result.level="Optimized";
    result.summary="Your operation has strong control across all major areas. The focus shifts from fixing gaps to improving forecasting, utilization, capacity, and decision quality.";
  }else if(adjustedOverall>=70){
    result.level="Controlled";
    result.summary=result.gated
      ?"Most of your operation is highly controlled, but at least one material operating gap prevents the business from being considered fully optimized."
      :"Your core processes are working, with specific areas where stronger control or automation can reduce manual work, errors, or revenue risk.";
  }else if(adjustedOverall>=55){
    result.level="Structured";
    result.summary="You have useful processes in place, but important parts still depend on manual updates, separate records, or individual follow-up.";
  }else if(adjustedOverall>=40){
    // A low category floor at this stage indicates reactive exposure even if the average clears 40.
    if(minimum<30){
      result.level="Reactive";
      result.summary="Several parts of the operation are functioning, but one or more major controls are weak enough that the business is still exposed to recurring manual work, errors, or missed revenue.";
    }else{
      result.level="Developing";
      result.summary="Your operation has working practices, but gaps in tracking, handoffs, billing, or real-time visibility create avoidable labor, errors, or revenue risk.";
    }
  }else{
    result.level="Reactive";
    result.summary="Core operational control depends heavily on manual work, memory, or disconnected records. Establishing reliable tracking and ownership should come before advanced automation.";
  }

  return result;
};

// ---------- Recommendation reason alignment ----------
categoryContext["Inventory Control"]=()=>`Tracking method: ${(A.tracking||[]).join(", ")||"not specified"}. Documentation: ${A.documented||"not specified"}. Unique identifiers: ${A.ids||"not specified"}.`;
categoryContext["Warehouse Organization"]=()=>`Storage definition: ${A.defined||"not specified"}. Item location method: ${A.find||"not specified"}. Search frequency: ${A.searchfreq||"not specified"}.`;
categoryContext["Project Allocation"]=()=>`Selection method: ${(A.select||[]).join(", ")||"not specified"}. Reservation visibility: ${A.reserve||"not specified"}. Conflicts: ${A.conflicts||"not specified"}. Pull lists: ${A.pull||"not specified"}.`;
categoryContext["Picking & Loading"]=()=>`Pull confirmation: ${A.pick||"not specified"}. Vehicle visibility: ${A.vehicle||"not specified"}. Missing/incorrect arrival frequency: ${A.arrival||"not specified"}.`;
categoryContext["Install & Return Control"]=()=>`Installation record: ${(A.install||[]).join(", ")||"not specified"}. Substitution tracking: ${A.changes||"not specified"}. Retrieval control: ${A.retrieve||"not specified"}. Return inspection: ${A.return||"not specified"}.`;
categoryContext["Team & Handoffs"]=()=>`Responsibility clarity: ${A.responsibility||"not specified"}. Communication: ${(A.handoffcomm||[]).join(", ")||"not specified"}. Handoff problems: ${(A.handoffproblems||[]).join(", ")||"not specified"}. Traceability: ${A.handofftrace||"not specified"}.`;
categoryContext["Condition Management"]=()=>`Receiving controls: ${(A.receiving||[]).join(", ")||"not specified"}. Maintenance tracking: ${(A.maintenance||[]).join(", ")||"not specified"}. Maintenance history: ${A.history||"not specified"}.`;
categoryContext["Financial & Lifecycle"]=()=>`Purchase traceability: ${A.trace||"not specified"}. Financial/lifecycle fields visible: ${(A.financial||[]).join(", ")||"not specified"}. Retirement process: ${(A.retire||[]).join(", ")||"not specified"}.`;
categoryContext["Billing & Revenue Control"]=()=>`Billing visibility: ${A.billing_status||"not specified"}. Reconciliation: ${A.payment_recon||"not specified"}. Missed/delayed billing: ${A.billing_misses||"not specified"}. Active properties: ${A.active_properties||"not specified"}. Typical extension: ${A.extension_amount||"not specified"}.`;
categoryContext["Operational Visibility"]=()=>`Current-location confidence: ${A.confidence||"not specified"}/5. Current systems: ${(A.systems||[]).join(", ")||"not specified"}.`;

// ---------- Exposure-aware prioritization ----------
function v7ExposureBoost(category){
  let boost=0;
  const friction=A.friction||[];
  const priority=(A.priority||"").toLowerCase();

  const highInventory=/5,000|5000|10,000|10000/.test(A.inventory_size||"");
  const highProjects=/30|31|40|50|60|\+/.test(A.projects||"");

  if(["Inventory Control","Warehouse Organization","Project Allocation","Picking & Loading","Install & Return Control","Team & Handoffs"].includes(category)){
    if(highInventory) boost+=3;
    if(highProjects) boost+=3;
  }

  if(category==="Billing & Revenue Control"){
    const miss={"A few times per year":2,"Monthly":7,"Weekly":11,"Several times per week":14}[A.billing_misses]||0;
    boost+=miss;

    const props={"21–30":3,"31–50":5,"51+":7}[A.active_properties]||0;
    boost+=props;

    const ext={"$1,500–$2,499":2,"$2,500+":3}[A.extension_amount]||0;
    boost+=ext;

    if(friction.some(x=>/billing|paid|payment|reconcil|charges/i.test(x))) boost+=3;
    if(/billing|invoice|payment|revenue|zelle/.test(priority)) boost+=4;
    if(/billing|payment/.test((A.outcome||"").toLowerCase())) boost+=3;
  }

  if(category==="Warehouse Organization" && friction.some(x=>/finding inventory|storage location/i.test(x))) boost+=3;
  if(category==="Project Allocation" && friction.some(x=>/available|double-book|pull list/i.test(x))) boost+=3;
  if(category==="Picking & Loading" && friction.some(x=>/pulling|loading|truck/i.test(x))) boost+=3;
  if(category==="Install & Return Control" && friction.some(x=>/installed|de-staging|missing inventory/i.test(x))) boost+=3;
  if(category==="Condition Management" && friction.some(x=>/damage|cleaning|repair/i.test(x))) boost+=3;
  if(category==="Financial & Lifecycle" && friction.some(x=>/purchasing|retire|financial/i.test(x))) boost+=3;
  if(category==="Operational Visibility" && friction.some(x=>/manual data|multiple places|reporting|memory/i.test(x))) boost+=3;

  if(["Warehouse Organization","Picking & Loading","Team & Handoffs"].includes(category)){
    if(["Weekly","Several times per week"].includes(A.extra_trips)) boost+=3;
  }

  if(["Condition Management","Financial & Lifecycle"].includes(category)){
    if(/\$10,000|\$25,000/.test(A.replacement_spend||"")) boost+=3;
  }

  return Math.min(18,boost);
}

recommendations=function(scores){
  return Object.entries(scores.categories)
    .filter(([category,score])=>score<80)
    .map(([category,score])=>({
      category,
      score,
      exposureBoost:v7ExposureBoost(category),
      priorityIndex:score-v7ExposureBoost(category),
      recommendation:v4RecMap[category],
      why:categoryContext[category]?.()||""
    }))
    .sort((a,b)=>a.priorityIndex-b.priorityIndex || a.score-b.score || a.category.localeCompare(b.category))
    .slice(0,3);
};

// ---------- Results presentation adjustments ----------
const __completeV7Base=complete;
complete=function(){
  __completeV7Base();

  const scores=calculateScores();
  const recs=recommendations(scores);

  const priorityHeading=[...document.querySelectorAll("h3")].find(h=>h.textContent.trim()==="Recommended first priorities");
  const priorityOrder=document.querySelector(".priority-order");
  const priorityCards=document.querySelector(".priority-cards");

  if(priorityOrder){
    priorityOrder.textContent="Priorities are based primarily on control gaps, with business exposure and your stated concerns used to elevate higher-risk issues.";
  }

  if(recs.length===0 && priorityHeading && priorityCards){
    priorityHeading.textContent="Operational outlook";
    if(priorityOrder){
      priorityOrder.textContent="No corrective priority scored below the action threshold. Your operation is in optimization territory rather than remediation territory.";
    }
    priorityCards.innerHTML=`<div class=priority-card><b>No urgent corrective action identified.</b><br><span class=small>Continue monitoring the lowest-scoring categories and focus future improvements on forecasting, utilization, capacity, and decision quality.</span></div>`;
  }else if(recs.length<3 && priorityHeading){
    priorityHeading.textContent="Recommended priority"+(recs.length===1?"":"ies");
  }

  // Explain a score cap when a critical category prevents an inflated maturity label.
  if(scores.gated){
    const hero=document.querySelector(".result-hero");
    if(hero && !document.querySelector("#criticalGapNote")){
      const weakest=Object.entries(scores.categories).sort((a,b)=>a[1]-b[1])[0];
      hero.insertAdjacentHTML("afterend",`
        <div id=criticalGapNote class=alignment-card>
          <p><b>Critical control rule applied:</b> ${esc(weakest[0])} scored ${weakest[1]}/100. The overall Operations Score is capped so a serious weakness in one core area cannot be hidden by strong scores elsewhere.</p>
        </div>`);
    }
  }

  // Add context that was collected but previously easy to miss.
  const contextGrid=document.querySelector(".context-grid");
  if(contextGrid && !document.querySelector("#v7ExtraContext")){
    contextGrid.insertAdjacentHTML("afterend",`
      <div id=v7ExtraContext class=alignment-card>
        <p><b>Storage locations:</b> ${esc(resultValue(A.locations))}</p>
        <p><b>Team structure:</b> ${esc(resultValue(A.structure))}</p>
        <p><b>Roles represented:</b> ${esc((A.roles||[]).join(", ")||"Not available")}</p>
        <p><b>Current systems:</b> ${esc((A.systems||[]).join(", ")||"Not available")}</p>
        <p><b>Primary friction:</b> ${esc((A.friction||[]).join(", ")||"Not available")}</p>
      </div>`);
  }
};

// Ensure a reopened result uses the calibrated v7 model.
viewSavedResults=async function(){
  if(await restoreLocalV5()){
    V5_COMPLETED=true;
    complete();
  }
};

// Older-version state is left untouched. v7/v8 use versioned keys and do not import it.
rebuild();
setTimeout(()=>welcome(),30);
</script>


<script id="v8-final-diagnostic-calibration">
const V8_STATE_KEY="home_staging_operations_assessment_v8_schema1";
const V8_DB_NAME="home_staging_operations_assessment_voice_v8";

// ---------- v8 browser recovery keys ----------
saveLocal=function(){

    localStorage.setItem(V8_STATE_KEY,JSON.stringify({

};

      }
    };
    req.onsuccess=()=>resolve(req.result);
    req.onerror=()=>reject(req.error);
  });
};

// ---------- Financial & Lifecycle: current visibility vs true history ----------
function v8FinancialVisibilityScore(){
  const a=A.financial||[];
  if(a.includes("None of these consistently")) return 5;

  const currentFields=[
    "Original purchase price",
    "Purchase date",
    "Replacement cost",
    "Current condition",
    "Current location"
  ];

  const lifecycleFields=[
    "Number of projects it has been used on",
    "Total time it has spent staged",
    "Cleaning costs",
    "Repair costs",
    "Sale or disposal information"
  ];

  const currentCount=currentFields.filter(x=>a.includes(x)).length;
  const lifecycleCount=lifecycleFields.filter(x=>a.includes(x)).length;

  // Basic current item visibility is useful, but it is not lifecycle history.
  let score=currentCount*5; // max 25 from current-state data

  // True history drives maturity.
  score+=lifecycleCount*15; // max 75 from usage/cost/disposal history

  // Without any lifecycle history, this component cannot exceed 40.
  if(lifecycleCount===0) score=Math.min(score,40);

  // One lifecycle signal is still early-stage visibility.
  if(lifecycleCount===1) score=Math.min(score,50);

  return Math.max(10,Math.min(100,score));
}

function v8RetirementScore(){
  const a=A.retire||[];
  if(a.includes("We do not have a defined process")) return 5;

  const evidenceBased=[
    "Repair cost",
    "Lack of use",
    "Financial data"
  ];

  const structuredButNonfinancial=[
    "Condition",
    "Age",
    "Storage constraints"
  ];

  const informal=[
    "Style trends",
    "Designer recommendation",
    "Owner judgment"
  ];

  const evidenceCount=evidenceBased.filter(x=>a.includes(x)).length;
  const structuredCount=structuredButNonfinancial.filter(x=>a.includes(x)).length;
  const informalCount=informal.filter(x=>a.includes(x)).length;

  let score=20;

  // Structured physical criteria help, but cannot establish mature lifecycle management alone.
  score += structuredCount*8;

  // Informal judgment adds limited maturity credit.
  score += informalCount*4;

  // Evidence tied to usage/cost/economics drives the mature end of the scale.
  score += evidenceCount*18;

  if(evidenceCount===0) score=Math.min(score,45);
  if(evidenceCount===1) score=Math.min(score,65);
  if(evidenceCount===2) score=Math.min(score,85);

  return Math.max(10,Math.min(100,score));
}

// ---------- Exact business-exposure model ----------
function v8ExposureDetails(category){
  let boost=0;
  const reasons=[];
  const friction=A.friction||[];
  const priority=(A.priority||"").toLowerCase();
  const outcome=(A.outcome||"").toLowerCase();

  const highInventory=["2,500–4,999","5,000+"].includes(A.inventory_size);
  const highProjects=["21–40","41–75","76+"].includes(A.projects);
  const veryHighProjects=["41–75","76+"].includes(A.projects);

  const add=(points,reason)=>{
    if(points>0){
      boost+=points;
      if(reason) reasons.push(reason);
    }
  };

  if(["Inventory Control","Warehouse Organization","Project Allocation","Picking & Loading","Install & Return Control","Team & Handoffs"].includes(category)){
    if(highInventory) add(3,`inventory volume is ${A.inventory_size}`);
    if(highProjects) add(veryHighProjects?4:3,`project volume is ${A.projects} per month`);
  }

  if(category==="Billing & Revenue Control"){
    const miss={"A few times per year":2,"Monthly":7,"Weekly":11,"Several times per week":14}[A.billing_misses]||0;
    if(miss) add(miss,`missed or delayed billing occurs ${String(A.billing_misses).toLowerCase()}`);

    const props={"21–30":3,"31–50":5,"51+":7}[A.active_properties]||0;
    if(props) add(props,`${A.active_properties} properties are actively staged`);

    const ext={"$1,500–$2,499":2,"$2,500+":3}[A.extension_amount]||0;
    if(ext) add(ext,`a typical extension is ${A.extension_amount}`);

    if(friction.some(x=>/billing|paid|payment|reconcil|charges/i.test(x))){
      add(3,"billing or payment tracking was selected as a friction point");
    }
    if(/billing|invoice|payment|revenue|zelle/.test(priority)){
      add(4,"billing or payment control was named as the first priority");
    }
    if(/billing|payment/.test(outcome)){
      add(3,"the desired outcome is billing or payment related");
    }
  }

  if(category==="Warehouse Organization" && friction.some(x=>/finding inventory|storage location/i.test(x))){
    add(3,"inventory location/search was selected as a friction point");
  }
  if(category==="Project Allocation" && friction.some(x=>/available|double-book|pull list/i.test(x))){
    add(3,"availability or pull-list control was selected as a friction point");
  }
  if(category==="Picking & Loading" && friction.some(x=>/pulling|loading|truck/i.test(x))){
    add(3,"pulling or loading was selected as a friction point");
  }
  if(category==="Install & Return Control" && friction.some(x=>/installed|de-staging|missing inventory/i.test(x))){
    add(3,"installation, de-staging, or missing inventory was selected as a friction point");
  }
  if(category==="Condition Management" && friction.some(x=>/damage|cleaning|repair/i.test(x))){
    add(3,"damage, cleaning, or repair was selected as a friction point");
  }
  if(category==="Financial & Lifecycle" && friction.some(x=>/purchasing|retire|financial/i.test(x))){
    add(3,"purchasing, retirement, or financial visibility was selected as a friction point");
  }
  if(category==="Operational Visibility" && friction.some(x=>/manual data|multiple places|reporting|memory/i.test(x))){
    add(3,"visibility or disconnected information was selected as a friction point");
  }

  if(["Warehouse Organization","Picking & Loading","Team & Handoffs"].includes(category) &&
     ["Weekly","Several times per week"].includes(A.extra_trips)){
    add(3,`extra trips occur ${String(A.extra_trips).toLowerCase()}`);
  }

  if(["Condition Management","Financial & Lifecycle"].includes(category) &&
     ["$10,000–$24,999","$25,000+"].includes(A.replacement_spend)){
    add(3,`replacement spending is ${A.replacement_spend} annually`);
  }

  return {boost:Math.min(18,boost),reasons:[...new Set(reasons)]};
}

// ---------- Recalibrated score model ----------
const __calculateScoresV8Base=calculateScores;
calculateScores=function(){
  const result=__calculateScoresV8Base();

  result.categories["Financial & Lifecycle"]=v7Avg([
    mscore("entry",{
      "When the order is placed":100,
      "When the item ships":90,
      "When the item arrives":75,
      "When someone has time to enter it":35,
      "It varies":25,
      "We do not formally enter new purchases into an inventory system":5
    }),
    mscore("trace",{
      "Very easily":100,
      "Usually":78,
      "Sometimes":50,
      "Rarely":22,
      "We generally cannot":5,
      "I am not sure":null
    }),
    v8FinancialVisibilityScore(),
    v8RetirementScore()
  ]);

  const categoryValues=Object.values(result.categories);
  const preciseRaw=categoryValues.reduce((a,b)=>a+b,0)/categoryValues.length;
  const rawOverall=Math.floor(preciseRaw); // prevents 99.5 from displaying as a perfect 100
  const minimum=Math.min(...categoryValues);

  let adjustedOverall=rawOverall;
  if(rawOverall>=85 && minimum<50) adjustedOverall=Math.min(adjustedOverall,84);
  if(rawOverall>=70 && minimum<40) adjustedOverall=Math.min(adjustedOverall,69);
  if(rawOverall>=55 && minimum<25) adjustedOverall=Math.min(adjustedOverall,54);

  result.preciseRawOverall=Math.round(preciseRaw*10)/10;
  result.rawOverall=rawOverall;
  result.minimumCategory=minimum;
  result.overall=adjustedOverall;
  result.gated=adjustedOverall!==rawOverall;
  result.maturityFloorApplied=false;

  if(adjustedOverall>=85 && minimum>=70){
    result.level="Optimized";
    result.summary="Your operation has strong control across all major areas. The focus shifts from fixing gaps to improving forecasting, utilization, capacity, and decision quality.";
  }else if(adjustedOverall>=70){
    result.level="Controlled";
    result.summary=result.gated
      ?"Most of your operation is highly controlled, but at least one material operating gap prevents the business from being considered fully optimized."
      :"Your core processes are working, with specific areas where stronger control or automation can reduce manual work, errors, or revenue risk.";
  }else if(adjustedOverall>=55){
    result.level="Structured";
    result.summary="You have useful processes in place, but important parts still depend on manual updates, separate records, or individual follow-up.";
  }else if(adjustedOverall>=40){
    if(minimum<30){
      result.level="Reactive";
      result.maturityFloorApplied=true;
      result.summary="Several parts of the operation are functioning, but one or more major controls are weak enough that the business is still exposed to recurring manual work, errors, or missed revenue.";
    }else{
      result.level="Developing";
      result.summary="Your operation has working practices, but gaps in tracking, handoffs, billing, or real-time visibility create avoidable labor, errors, or revenue risk.";
    }
  }else{
    result.level="Reactive";
    result.summary="Core operational control depends heavily on manual work, memory, or disconnected records. Establishing reliable tracking and ownership should come before advanced automation.";
  }

  return result;
};

// ---------- Exposure-aware recommendation order with explicit explanation ----------
recommendations=function(scores){
  return Object.entries(scores.categories)
    .filter(([category,score])=>score<80)
    .map(([category,score])=>{
      const exposure=v8ExposureDetails(category);
      return {
        category,
        score,
        exposureBoost:exposure.boost,
        exposureReasons:exposure.reasons,
        priorityIndex:score-exposure.boost,
        recommendation:v4RecMap[category],
        why:categoryContext[category]?.()||""
      };
    })
    .sort((a,b)=>a.priorityIndex-b.priorityIndex || a.score-b.score || a.category.localeCompare(b.category))
    .slice(0,3);
};

// ---------- Results explanations ----------
const __completeV8Base=complete;
complete=function(){
  __completeV8Base();

  const scores=calculateScores();
  const recs=recommendations(scores);
  const cards=[...document.querySelectorAll(".priority-card")];

  // Add a concrete exposure explanation only when exposure actually contributed.
  cards.forEach((card,i)=>{
    const rec=recs[i];
    if(!rec || !rec.exposureBoost || !rec.exposureReasons?.length) return;

    const line=document.createElement("span");
    line.className="priority-reason";
    line.innerHTML=`<b>Elevated by business exposure:</b> ${esc(rec.exposureReasons.slice(0,3).join("; "))}.`;
    card.appendChild(line);
  });

  // Explain a maturity-floor rule even when the numeric score itself is not capped.
  if(scores.maturityFloorApplied && !document.querySelector("#maturityFloorNote")){
    const weakest=Object.entries(scores.categories).sort((a,b)=>a[1]-b[1])[0];
    const hero=document.querySelector(".result-hero");
    if(hero){
      hero.insertAdjacentHTML("afterend",`
        <div id=maturityFloorNote class=alignment-card>
          <p><b>Control-floor rule applied:</b> ${esc(weakest[0])} scored ${weakest[1]}/100. Although the overall score is ${scores.overall}, a core category below 30 keeps the operation in the Reactive stage until that control gap is stabilized.</p>
        </div>`);
    }
  }
};

// Keep the v8 build completely separate from older local state without deleting it.
rebuild();
setTimeout(()=>welcome(),40);
</script>

    }));

readLocal=function(){

openVoiceDB=function(){

      }
    };
    req.onsuccess=()=>resolve(req.result);
    req.onerror=()=>reject(req.error);
  });

function v9OrderedExposureReasons(category, details){
  const reasons=[...(details?.reasons||[])];

  const priorityReasons=reasons.filter(r=>/first priority|desired outcome|friction point/i.test(r));
  const riskReasons=reasons.filter(r=>/missed|delayed|extra trips|replacement spending/i.test(r));
  const scaleReasons=reasons.filter(r=>/properties|project volume|inventory volume|extension/i.test(r));
  const other=reasons.filter(r=>
    !priorityReasons.includes(r) &&
    !riskReasons.includes(r) &&
    !scaleReasons.includes(r)
  );

  return [...new Set([...priorityReasons,...riskReasons,...scaleReasons,...other])];
}

recommendations=function(scores){
  return Object.entries(scores.categories)
    .filter(([category,score])=>score<80)
    .map(([category,score])=>{
      const exposure=v8ExposureDetails(category);
      const orderedReasons=v9OrderedExposureReasons(category,exposure);

      return {
        category,
        score,
        exposureBoost:exposure.boost,
        exposureReasons:orderedReasons,
        priorityIndex:score-exposure.boost,
        recommendation:v4RecMap[category],
        why:categoryContext[category]?.()||""
      };
    })
    .sort((a,b)=>
      a.priorityIndex-b.priorityIndex ||
      b.exposureBoost-a.exposureBoost ||
      a.score-b.score ||
      a.category.localeCompare(b.category)
    )
    .slice(0,3);
};

complete=function(){

  const scores=calculateScores();
  const recs=recommendations(scores);
  const cards=[...document.querySelectorAll(".priority-card")];

  cards.forEach((card,i)=>{
    const rec=recs[i];
    if(!rec || !rec.exposureBoost || !rec.exposureReasons?.length) return;

    [...card.querySelectorAll(".priority-reason")].forEach(node=>{
      if(/Elevated by business exposure:/i.test(node.textContent||"")) node.remove();
    });

    const line=document.createElement("span");
    line.className="priority-reason";
    line.innerHTML=`<b>Business exposure considered:</b> ${esc(rec.exposureReasons.join("; "))}.`;
    card.appendChild(line);
  });
};

</script>


<script id="qa-exact-url-guard">
const QA_ALLOWED_LOCATIONS = [
  {
    origin: "https://clairenhaus.github.io",
    path: "/clairen-haus/qa-assessment"
  },
  {
    origin: "https://clairenhaus.com",
    path: "/qa-assessment"
  }
];

canSubmitToProduction = function(){
  if(SUBMISSION_MODE !== "production") return false;
  if(window.location.protocol !== "https:") return false;

  const origin = window.location.origin;
  const path = (window.location.pathname || "/").replace(/\/+$/,"");

  return QA_ALLOWED_LOCATIONS.some(
    location => location.origin === origin && location.path === path
  );
};
</script>


<script id="v10-insert-only-submission">
const V10_STATE_KEY="home_staging_operations_assessment_v10_schema1";
const V10_DB_NAME="home_staging_operations_assessment_voice_v10";

// Keep v10 recovery isolated from prior QA builds.
saveLocal=function(){
  try{
    localStorage.setItem(V10_STATE_KEY,JSON.stringify({
      answers:A,
      idx,
      completed:V5_COMPLETED,
      submitted:V5_SUBMITTED,
      submissionId:window.__submissionId||window.__lastSubmissionId||null,
      lastResults:V5_LAST_RESULTS,
      savedAt:new Date().toISOString()
    }));
  }catch(e){}
};

readLocal=function(){
  try{
    const raw=localStorage.getItem(V10_STATE_KEY);
    return raw?JSON.parse(raw):null;
  }catch(e){return null}
};

clearLocal=function(){
  try{localStorage.removeItem(V10_STATE_KEY)}catch(e){}
};

openVoiceDB=function(){
  return new Promise((resolve,reject)=>{
    const req=indexedDB.open(V10_DB_NAME,1);
    req.onupgradeneeded=()=>{
      const db=req.result;
      if(!db.objectStoreNames.contains(V5_DB_STORE)){
        db.createObjectStore(V5_DB_STORE,{keyPath:"id"});
      }
    };
    req.onsuccess=()=>resolve(req.result);
    req.onerror=()=>reject(req.error);
  });
};

// Insert-only assessment submission.
// We deliberately do not use PostgREST upsert because public assessment respondents
// do not need anonymous SELECT or UPDATE access to stored assessment rows.
saveAssessment=async function(scores,recs){
  sanitizeBranches();

  const submissionId=window.__submissionId||crypto.randomUUID();
  window.__submissionId=submissionId;
  saveLocal();

  const voicePaths=await uploadVoiceNotes(submissionId);

  const payload={
    id:submissionId,
    respondent_name:A.name,
    company_name:A.company,
    email:A.email,
    phone:A.phone||null,
    website:A.website||null,
    overall_score:scores.overall,
    maturity_level:scores.level,
    category_scores:scores.categories,
    recommendations:recs,
    responses:{...A,_roi_inputs:estimateROIInputs()},
    voice_note_paths:voicePaths,
    completed_at:new Date().toISOString(),
    user_agent:navigator.userAgent
  };

  const res=await fetch(`${SUPABASE_URL}/rest/v1/staging_inventory_assessments`,{
    method:"POST",
    headers:{
      "apikey":SUPABASE_ANON_KEY,
      "Authorization":`Bearer ${SUPABASE_ANON_KEY}`,
      "Content-Type":"application/json",
      "Prefer":"return=minimal"
    },
    body:JSON.stringify(payload)
  });

  if(res.ok){
    return submissionId;
  }

  const body=await res.text();

  // A retry after an ambiguous network failure may encounter the row that was
  // successfully inserted by the first attempt. Postgres uniqueness violation
  // is code 23505 and PostgREST maps it to HTTP 409.
  if(res.status===409){
    let parsed=null;
    try{parsed=JSON.parse(body)}catch(e){}

    const duplicatePrimaryKey =
      parsed?.code==="23505" ||
      /duplicate key|unique constraint|staging_inventory_assessments_pkey/i.test(body);

    if(duplicatePrimaryKey){
      return submissionId;
    }
  }

  throw new Error(`Assessment save failed (${res.status}): ${body.slice(0,220)}`);
};

// More accurate hosted microphone error copy.
record=async function(id){
  const b=document.querySelector("#recBtn");
  if(recorder&&recorder.state==="recording"){recorder.stop();return}
  if(!navigator.mediaDevices||!window.MediaRecorder){
    err("Voice recording is not supported in this browser.");
    return;
  }

  try{
    const stream=await navigator.mediaDevices.getUserMedia({audio:true});
    chunks=[];
    recorder=new MediaRecorder(stream);

    recorder.ondataavailable=e=>{
      if(e.data.size)chunks.push(e.data);
    };

    recorder.onstart=()=>{
      if(b){
        b.classList.add("active");
        b.textContent="■ Stop Recording";
      }
      const panel=document.querySelector("#voicePanel");
      const status=document.querySelector("#vstatus");
      if(panel)panel.classList.remove("hidden");
      if(status)status.textContent="Recording…";
      timer=setTimeout(()=>{
        if(recorder?.state==="recording")recorder.stop();
      },120000);
    };

    recorder.onstop=async()=>{
      clearTimeout(timer);
      stream.getTracks().forEach(t=>t.stop());

      const blob=new Blob(chunks,{type:recorder.mimeType||"audio/webm"});
      const url=URL.createObjectURL(blob);

      if(notes[id]?.url)URL.revokeObjectURL(notes[id].url);

      notes[id]={
        blob,
        url,
        type:blob.type,
        at:new Date().toISOString()
      };

      await saveVoiceNoteToDB(id,notes[id]);

      const status=document.querySelector("#vstatus");
      const audio=document.querySelector("#audio");
      const btn=document.querySelector("#recBtn");

      if(status)status.textContent="Recorded";
      if(audio)audio.innerHTML=`<audio controls src="${url}"></audio>`;
      if(btn){
        btn.classList.remove("active");
        btn.textContent="🎤 Record Again";
      }

      recorder=null;
      saveLocal();
    };

    recorder.start();
  }catch(e){
    const name=e?.name||"";
    if(name==="NotAllowedError"||name==="SecurityError"){
      err("Microphone permission was denied. Allow microphone access for this site in your browser settings and try again.");
    }else if(name==="NotFoundError"||name==="DevicesNotFoundError"){
      err("No microphone or audio input device was available. Connect or enable a microphone and try again.");
    }else{
      err("Voice recording could not start. Check this site's microphone permission and your available audio input, then try again.");
    }
  }
};

rebuild();
setTimeout(()=>welcome(),60);
</script>

<script id="v10-responses-first-recovery">
/*
  RESPONSES-FIRST RECOVERY
  ------------------------
  Preserve the existing v10 localStorage and IndexedDB keys so the completed
  clairenhaus.com assessment can be recovered.

  Important change:
  1. Save the assessment row FIRST.
  2. Attempt voice uploads only AFTER the row is confirmed saved.
  3. Voice upload failure never discards or blocks the questionnaire responses.
*/

function expectedVoicePaths(submissionId){
  return Object.entries(notes).map(([questionId,note])=>{
    const extension=fileExt(note.type);
    return {
      question_id:questionId,
      path:`${submissionId}/${questionId}.${extension}`,
      mime_type:note.type||"audio/webm",
      recorded_at:note.at,
      upload_status:"expected"
    };
  });
}

async function insertAssessmentRowFirst(scores,recs,submissionId){
  const plannedVoicePaths=expectedVoicePaths(submissionId);

  const payload={
    id:submissionId,
    respondent_name:A.name,
    company_name:A.company,
    email:A.email,
    phone:A.phone||null,
    website:A.website||null,
    overall_score:scores.overall,
    maturity_level:scores.level,
    category_scores:scores.categories,
    recommendations:recs,
    responses:{...A,_roi_inputs:estimateROIInputs()},
    voice_note_paths:plannedVoicePaths,
    completed_at:new Date().toISOString(),
    user_agent:navigator.userAgent
  };

  const res=await fetch(`${SUPABASE_URL}/rest/v1/staging_inventory_assessments`,{
    method:"POST",
    headers:{
      "apikey":SUPABASE_ANON_KEY,
      "Authorization":`Bearer ${SUPABASE_ANON_KEY}`,
      "Content-Type":"application/json",
      "Prefer":"return=minimal"
    },
    body:JSON.stringify(payload)
  });

  if(res.ok){
    return {saved:true,duplicate:false};
  }

  const body=await res.text();

  if(res.status===409){
    let parsed=null;
    try{parsed=JSON.parse(body)}catch(e){}
    const duplicatePrimaryKey =
      parsed?.code==="23505" ||
      /duplicate key|unique constraint|staging_inventory_assessments_pkey/i.test(body);

    if(duplicatePrimaryKey){
      return {saved:true,duplicate:true};
    }
  }

  throw new Error(`Assessment row save failed (${res.status}): ${body.slice(0,260)}`);
}

async function uploadVoiceAfterAssessmentSaved(submissionId){
  if(!Object.keys(notes).length){
    return {ok:true,count:0};
  }

  try{
    const paths=await uploadVoiceNotes(submissionId);
    return {ok:true,count:paths.length};
  }catch(e){
    return {ok:false,count:0,error:e};
  }
}

saveAssessment=async function(scores,recs){
  sanitizeBranches();

  const submissionId=window.__submissionId||crypto.randomUUID();
  window.__submissionId=submissionId;
  saveLocal();

  // Critical recovery change: database row is committed before Storage is touched.
  const rowResult=await insertAssessmentRowFirst(scores,recs,submissionId);

  // Voice upload is now secondary and non-blocking.
  const voiceResult=await uploadVoiceAfterAssessmentSaved(submissionId);

  return {
    id:submissionId,
    rowSaved:true,
    duplicate:rowResult.duplicate,
    voice:voiceResult
  };
};

persistResults=async function(scores,recs){
  const node=document.querySelector("#submitStatus");
  const retry=document.querySelector("#retryWrap");
  if(!node)return;

  if(!canSubmitToProduction()){
    node.className="submit-status";
    node.textContent="Submission is disabled on this URL. Your completed responses remain saved in this browser.";
    if(retry)retry.innerHTML="";
    return;
  }

  if(V5_SUBMITTED && (window.__lastSubmissionId||window.__submissionId)){
    const savedId=window.__lastSubmissionId||window.__submissionId;
    node.className="submit-status ok";
    node.textContent="Assessment saved successfully. Reference: "+String(savedId).slice(0,8).toUpperCase();
    if(retry)retry.innerHTML="";
    return;
  }

  node.className="submit-status";
  node.textContent="Saving assessment responses…";
  if(retry)retry.innerHTML="";

  try{
    const result=await saveAssessment(scores,recs);
    const id=result.id;

    window.__lastSubmissionId=id;
    V5_SUBMITTED=true;
    saveLocal();

    node.className="submit-status ok";

    if(result.voice.ok){
      node.textContent=
        "Assessment saved successfully. Reference: "+
        id.slice(0,8).toUpperCase()+
        (result.voice.count ? " Voice note saved." : "");
      if(retry)retry.innerHTML="";
    }else{
      node.innerHTML=
        "Assessment responses saved successfully. Reference: <b>"+
        id.slice(0,8).toUpperCase()+
        "</b><br><span class=small>Your voice note could not be uploaded. Your questionnaire responses are safely saved.</span>";

      if(retry){
        retry.innerHTML=
          `<button class="btn secondary" style="margin-top:10px" onclick="retryVoiceOnly()">Retry voice upload</button>`;
      }
      window.__lastVoiceUploadError=String(result.voice.error||"Voice upload failed");
    }
  }catch(e){
    V5_SUBMITTED=false;
    saveLocal();

    node.className="submit-status bad";
    node.textContent="The assessment responses could not be saved. Your completed responses are still preserved in this browser.";

    if(retry){
      retry.innerHTML=
        `<button class="btn secondary" style="margin-top:10px" onclick="retrySubmission()">Retry save</button>`;
    }
    console.error(e);
  }
};

retryVoiceOnly=async function(){
  const node=document.querySelector("#submitStatus");
  const retry=document.querySelector("#retryWrap");
  const id=window.__lastSubmissionId||window.__submissionId;

  if(!id){
    if(node){
      node.className="submit-status bad";
      node.textContent="The saved assessment reference is unavailable. Do not start a new assessment.";
    }
    return;
  }

  if(node){
    node.className="submit-status";
    node.textContent="Retrying voice upload…";
  }

  try{
    const result=await uploadVoiceAfterAssessmentSaved(id);

    if(result.ok){
      if(node){
        node.className="submit-status ok";
        node.textContent=
          "Assessment saved successfully. Reference: "+
          String(id).slice(0,8).toUpperCase()+
          (result.count ? " Voice note saved." : "");
      }
      if(retry)retry.innerHTML="";
    }else{
      throw result.error||new Error("Voice upload failed.");
    }
  }catch(e){
    if(node){
      node.className="submit-status ok";
      node.innerHTML=
        "Assessment responses are saved. Reference: <b>"+
        String(id).slice(0,8).toUpperCase()+
        "</b><br><span class=small>The voice note is still stored locally in this browser but has not uploaded to Supabase.</span>";
    }
    if(retry){
      retry.innerHTML=
        `<button class="btn secondary" style="margin-top:10px" onclick="retryVoiceOnly()">Retry voice upload</button>`;
    }
    console.error(e);
  }
};

// Do not automatically delete the saved local assessment after successful row save.
// The user can clear it later with Start New Assessment after confirming the Supabase row.
rebuild();
setTimeout(()=>welcome(),80);
</script>
