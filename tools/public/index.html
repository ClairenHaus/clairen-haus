<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clairen Haus — 30-Day Content Calendar</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Plus Jakarta Sans',sans-serif;background:#080812;color:#F0F0F8;min-height:100vh;}
button,select,input,textarea{font-family:'Plus Jakarta Sans',sans-serif;}

/* GRADIENT BAR */
.gbar{height:3px;background:linear-gradient(90deg,#00C2B7,#4A6FFF,#9B59FF,#FF8C32);flex-shrink:0;}

/* LOGO */
.logo{font-size:12px;font-weight:800;letter-spacing:2px;color:#00C2B7;}
.logo em{color:#FF8C32;font-style:normal;}

/* ======================== GATE ======================== */
.gate{min-height:100vh;display:flex;flex-direction:column;}
.gate-body{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 24px;background:radial-gradient(ellipse at 50% 0%,rgba(0,194,183,.18) 0%,transparent 65%);}
.gate-pill{display:inline-flex;align-items:center;gap:6px;background:rgba(255,140,50,.1);border:1px solid rgba(255,140,50,.25);border-radius:20px;padding:4px 14px;font-size:11px;color:#FF8C32;font-weight:700;letter-spacing:.5px;margin-bottom:20px;}
.gate h1{font-size:clamp(22px,4vw,40px);font-weight:800;text-align:center;line-height:1.2;max-width:600px;margin-bottom:10px;}
.gate h1 span{background:linear-gradient(90deg,#00C2B7,#4A6FFF 50%,#9B59FF);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.gate p{color:#888899;font-size:14px;text-align:center;max-width:440px;line-height:1.7;margin-bottom:36px;}
.gate-form{width:100%;max-width:400px;display:flex;flex-direction:column;gap:10px;}
.field label{display:block;font-size:10px;font-weight:800;letter-spacing:1.2px;color:#666677;margin-bottom:5px;}
.field input{width:100%;background:#0D0D1A;border:1.5px solid rgba(255,255,255,.08);border-radius:10px;padding:12px 15px;color:#F0F0F8;font-size:14px;transition:border-color .2s;}
.field input:focus{outline:none;border-color:#00C2B7;}
.field input::placeholder{color:#444455;}
.btn-primary{width:100%;padding:14px;background:linear-gradient(90deg,#FF8C32,#E86A00);border:none;border-radius:10px;color:#fff;font-size:14px;font-weight:800;cursor:pointer;margin-top:6px;transition:opacity .2s;letter-spacing:.3px;}
.btn-primary:hover{opacity:.9;}
.gate-foot{font-size:11px;color:#444455;text-align:center;margin-top:10px;}
.err{background:rgba(232,93,74,.1);border:1px solid rgba(232,93,74,.3);border-radius:8px;padding:9px 13px;font-size:12px;color:#E85D4A;margin-top:4px;}

/* ======================== WIZARD ======================== */
.wizard{min-height:100vh;display:flex;flex-direction:column;}
.wiz-body{flex:1;padding:32px 24px;max-width:700px;margin:0 auto;width:100%;}
.wiz-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:40px;}
.wiz-prog{display:flex;gap:5px;align-items:center;}
.wdot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.1);transition:all .3s;}
.wdot.active{background:#FF8C32;width:22px;border-radius:4px;}
.wdot.done{background:#00C2B7;}
.step-anim{animation:fadeUp .3s ease;}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.step-num{font-size:10px;font-weight:800;letter-spacing:1.2px;color:#666677;margin-bottom:7px;}
.step-q{font-size:clamp(18px,3vw,26px);font-weight:800;margin-bottom:6px;line-height:1.25;}
.step-sub{font-size:13px;color:#888899;margin-bottom:28px;line-height:1.6;}
.opt-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(175px,1fr));gap:8px;margin-bottom:26px;}
.opt{padding:12px 14px;background:#0D0D1A;border:1.5px solid rgba(255,255,255,.07);border-radius:10px;cursor:pointer;font-size:13px;font-weight:600;color:#AAAACC;transition:all .15s;text-align:left;}
.opt:hover{border-color:#4A6FFF;color:#F0F0F8;}
.opt.sel{border-color:#FF8C32;background:rgba(255,140,50,.08);color:#FF8C32;}
.opt.msel{border-color:#00C2B7;background:rgba(0,194,183,.08);color:#00C2B7;}
.plat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin-bottom:26px;}
.plat-opt{padding:14px 10px;background:#0D0D1A;border:1.5px solid rgba(255,255,255,.07);border-radius:10px;cursor:pointer;text-align:center;transition:all .15s;}
.plat-opt:hover{border-color:#4A6FFF;}
.plat-opt.sel{border-color:#00C2B7;background:rgba(0,194,183,.08);}
.plat-ico{font-size:22px;margin-bottom:5px;}
.plat-nm{font-size:11px;font-weight:700;color:#AAAACC;}
.plat-opt.sel .plat-nm{color:#00C2B7;}
.voice-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:26px;}
.voice-opt{padding:14px;background:#0D0D1A;border:1.5px solid rgba(255,255,255,.07);border-radius:10px;cursor:pointer;transition:all .15s;}
.voice-opt:hover{border-color:#9B59FF;}
.voice-opt.sel{border-color:#9B59FF;background:rgba(155,89,255,.1);}
.voice-t{font-size:13px;font-weight:700;margin-bottom:4px;color:#F0F0F8;}
.voice-opt.sel .voice-t{color:#9B59FF;}
.voice-d{font-size:11px;color:#666677;line-height:1.5;}
.ta-input{width:100%;background:#0D0D1A;border:1.5px solid rgba(255,255,255,.08);border-radius:10px;padding:13px 15px;color:#F0F0F8;font-size:13px;resize:vertical;min-height:90px;line-height:1.6;margin-bottom:26px;}
.ta-input:focus{outline:none;border-color:#00C2B7;}
.ta-input::placeholder{color:#444455;}
.wiz-nav{display:flex;gap:10px;}
.btn-back{padding:12px 20px;background:rgba(255,255,255,.05);border:1.5px solid rgba(255,255,255,.08);border-radius:10px;color:#888899;font-size:13px;font-weight:700;cursor:pointer;}
.btn-next{flex:1;padding:12px;background:linear-gradient(90deg,#FF8C32,#E86A00);border:none;border-radius:10px;color:#fff;font-size:13px;font-weight:800;cursor:pointer;transition:opacity .2s;}
.btn-next:hover{opacity:.9;}
.btn-next:disabled{opacity:.35;cursor:not-allowed;}

/* ======================== GENERATING ======================== */
.gen-screen{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;background:radial-gradient(ellipse at 50% 30%,rgba(74,111,255,.12) 0%,transparent 65%);}
.spinner{width:56px;height:56px;border-radius:50%;border:3px solid rgba(0,194,183,.15);border-top-color:#00C2B7;animation:spin 1s linear infinite;margin:0 auto 22px;}
@keyframes spin{to{transform:rotate(360deg)}}
.gen-t{font-size:20px;font-weight:800;margin-bottom:8px;}
.gen-s{font-size:13px;color:#888899;margin-bottom:36px;}
.gen-steps{display:flex;flex-direction:column;gap:10px;max-width:320px;}
.gstep{display:flex;align-items:center;gap:10px;font-size:13px;color:#888899;opacity:.4;transition:all .4s;}
.gstep.act{color:#00C2B7;opacity:1;}
.gstep.done{color:#1D9E75;opacity:1;}
.gdot{width:7px;height:7px;border-radius:50%;background:currentColor;flex-shrink:0;}

/* ======================== PILLARS ======================== */
.pillars-screen{min-height:100vh;display:flex;flex-direction:column;}
.pillars-body{flex:1;max-width:660px;margin:0 auto;width:100%;padding:32px 24px;}
.pr-t{font-size:clamp(20px,3vw,28px);font-weight:800;margin-bottom:6px;}
.pr-s{font-size:13px;color:#888899;margin-bottom:28px;line-height:1.6;}
.pillar-list{display:flex;flex-direction:column;gap:8px;margin-bottom:28px;}
.pillar-row{display:flex;align-items:center;gap:14px;padding:14px 16px;background:#0D0D1A;border-radius:12px;border:1.5px solid rgba(255,255,255,.06);}
.p-swatch{width:38px;height:38px;border-radius:9px;flex-shrink:0;}
.p-info{flex:1;}
.p-name{font-size:14px;font-weight:700;margin-bottom:3px;}
.p-desc{font-size:11px;color:#888899;line-height:1.5;}
.p-count{font-size:22px;font-weight:800;color:#FF8C32;flex-shrink:0;}
.pr-nav{display:flex;gap:10px;}

/* ======================== CALENDAR ======================== */
.cal-app{min-height:100vh;display:flex;flex-direction:column;}
.cal-hd{background:#0D0D1A;border-bottom:1px solid rgba(255,255,255,.05);flex-shrink:0;}
.cal-hinner{max-width:1020px;margin:0 auto;padding:14px 20px 0;}
.cal-htop{display:flex;align-items:center;gap:12px;margin-bottom:14px;}
.cal-info{flex:1;}
.cal-title{font-size:14px;font-weight:800;color:#F0F0F8;}
.cal-meta{font-size:11px;color:#666677;margin-top:2px;}
.cal-tabs{display:flex;gap:2px;overflow-x:auto;}
.ctab{padding:8px 14px;border:none;border-radius:8px 8px 0 0;cursor:pointer;font-size:12px;font-weight:700;display:flex;align-items:center;gap:5px;white-space:nowrap;background:rgba(255,255,255,.04);color:#888899;transition:all .15s;border-bottom:2px solid transparent;}
.ctab.active{background:rgba(255,255,255,.09);color:#F0F0F8;border-bottom-color:#FF8C32;}
.tbadge{background:rgba(255,255,255,.08);border-radius:8px;padding:1px 6px;font-size:10px;}
.ctab.active .tbadge{background:#FF8C32;color:#fff;}
.cal-filters{background:#080812;border-bottom:1px solid rgba(255,255,255,.05);padding:9px 20px;flex-shrink:0;}
.cf-inner{max-width:1020px;margin:0 auto;display:flex;flex-wrap:wrap;gap:5px;align-items:center;}
.cf-lbl{font-size:10px;font-weight:800;letter-spacing:1px;color:#444455;margin-right:2px;}
.cf-btn{padding:3px 11px;border-radius:16px;border:none;cursor:pointer;font-size:11px;font-weight:700;background:rgba(255,255,255,.05);color:#888899;transition:all .15s;}
.cf-btn.act{background:#FF8C32;color:#fff;}
.cf-sep{width:1px;height:14px;background:rgba(255,255,255,.08);margin:0 4px;}
.cal-body{flex:1;max-width:1020px;margin:0 auto;width:100%;padding:24px 20px 80px;}

/* EMPTY / GEN */
.plat-empty{text-align:center;padding:60px 24px;}
.plat-ico2{font-size:44px;margin-bottom:16px;}
.plat-et{font-size:18px;font-weight:800;margin-bottom:8px;}
.plat-es{font-size:13px;color:#888899;margin-bottom:24px;line-height:1.6;}
.gen-plat-btn{display:inline-flex;align-items:center;gap:8px;padding:13px 28px;background:linear-gradient(90deg,#00C2B7,#4A6FFF);border:none;border-radius:10px;color:#fff;font-size:13px;font-weight:800;cursor:pointer;transition:opacity .2s;}
.gen-plat-btn:hover{opacity:.9;}
.gen-plat-btn:disabled{opacity:.5;cursor:wait;}

/* WEEK */
.week-sec{margin-bottom:32px;}
.week-hdr{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
.wline{flex:1;height:1px;background:rgba(255,255,255,.05);}
.wlbl{font-size:10px;font-weight:800;letter-spacing:1.5px;color:#FF8C32;}
.wtheme{font-size:11px;color:#444455;}
.posts-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(278px,1fr));gap:11px;}

/* CARD */
.pcard{background:#0D0D1A;border-radius:12px;border:1.5px solid rgba(255,255,255,.05);cursor:pointer;overflow:hidden;transition:border-color .2s;}
.pcard:hover{border-color:rgba(255,255,255,.1);}
.pcard.exp{border-color:var(--pc,#FF8C32);}
.card-h{padding:11px 13px 9px;}
.card-m{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px;}
.cbadges{display:flex;gap:5px;flex-wrap:wrap;}
.dbadge{background:#FF8C32;color:#080812;border-radius:5px;padding:2px 7px;font-size:10px;font-weight:800;}
.fbadge{background:rgba(255,255,255,.06);color:#AAAACC;border-radius:5px;padding:2px 7px;font-size:10px;font-weight:600;}
.plbl{font-size:9px;font-weight:800;letter-spacing:.4px;}
.chook{font-size:12px;font-weight:700;color:#F0F0F8;line-height:1.4;margin:0;}
.card-p{padding:7px 13px 9px;display:flex;justify-content:space-between;align-items:center;}
.card-p span:first-child{font-size:11px;color:#444455;}
.sbadge{font-size:10px;font-weight:700;border-radius:5px;padding:2px 8px;}
.s-draft{background:rgba(255,255,255,.05);color:#666677;}
.s-scheduled{background:rgba(74,111,255,.15);color:#4A6FFF;}
.s-published{background:rgba(29,158,117,.15);color:#1D9E75;}

/* CARD BODY */
.card-b{padding:12px;}
.ctabs{display:flex;gap:4px;margin-bottom:10px;flex-wrap:wrap;}
.ctab2{padding:4px 10px;border-radius:6px;border:none;cursor:pointer;font-size:11px;font-weight:700;background:rgba(255,255,255,.05);color:#888899;transition:all .15s;}
.ctab2.act{background:#FF8C32;color:#fff;}
.ctab2.design{background:rgba(155,89,255,.1);color:#9B59FF;}
.ctab2.design.act{background:#9B59FF;color:#fff;}
.cbox{background:#080812;border-radius:8px;padding:11px;margin-bottom:8px;max-height:190px;overflow-y:auto;}
.cbox p{font-size:12px;color:#CCCCDD;line-height:1.85;white-space:pre-wrap;margin:0;}
.cc{font-size:10px;font-weight:700;margin-bottom:7px;}
.cc-ok{color:#1D9E75;} .cc-warn{color:#F4A91E;} .cc-over{color:#E85D4A;}
.ebox{border-radius:8px;padding:11px;margin-bottom:8px;}
.ebox-lbl{font-size:10px;font-weight:800;letter-spacing:.5px;margin-bottom:5px;}
.ebox p{font-size:12px;color:#CCCCDD;line-height:1.6;margin:0;}
.e-alt{background:rgba(74,111,255,.08);border:1px solid rgba(74,111,255,.2);}
.e-hash{background:rgba(0,194,183,.08);border:1px solid rgba(0,194,183,.2);}
.dbox-h{background:linear-gradient(135deg,#0D0D1A,#111128);border-radius:8px;padding:9px 12px;margin-bottom:7px;border:1px solid rgba(155,89,255,.2);}
.dbox-t{font-size:10px;font-weight:800;letter-spacing:1px;color:#9B59FF;margin-bottom:3px;}
.dbox-s{font-size:10px;color:#888899;}
.codebox{background:#050510;border-radius:8px;padding:11px;margin-bottom:8px;max-height:200px;overflow-y:auto;}
.codebox pre{font-size:11px;color:#90FFD0;line-height:1.8;white-space:pre-wrap;font-family:monospace;margin:0;}
.card-acts{display:flex;gap:6px;flex-wrap:wrap;}
.act-btn{flex:1;padding:8px 6px;border:none;border-radius:7px;font-size:11px;font-weight:700;cursor:pointer;min-width:70px;transition:all .2s;}
.btn-cpy{background:#FF8C32;color:#fff;}
.btn-cpy.cpd{background:#1D9E75;}
.btn-regen{background:rgba(255,255,255,.05);color:#888899;border:1px solid rgba(255,255,255,.08);}
.btn-regen:hover{background:rgba(255,255,255,.1);color:#F0F0F8;}
.sselect{flex:1;padding:7px 8px;border-radius:7px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);color:#CCCCDD;font-size:11px;font-weight:600;cursor:pointer;min-width:70px;}

/* EXPORT */
.export-bar{position:fixed;bottom:18px;right:18px;z-index:50;}
.exp-btn{padding:9px 16px;background:#0D0D1A;border:1.5px solid rgba(0,194,183,.3);border-radius:10px;color:#00C2B7;font-size:12px;font-weight:700;cursor:pointer;transition:all .2s;}
.exp-btn:hover{background:rgba(0,194,183,.08);}

/* MODAL */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:100;display:flex;align-items:center;justify-content:center;padding:24px;}
.modal{background:#111128;border-radius:14px;padding:26px;max-width:500px;width:100%;border:1.5px solid rgba(255,255,255,.09);}
.modal h3{font-size:15px;font-weight:800;margin-bottom:10px;}
.modal p{font-size:12px;color:#888899;line-height:1.65;margin-bottom:11px;}
.modal code{display:block;background:#050510;border-radius:8px;padding:11px;font-size:10.5px;color:#90FFD0;white-space:pre-wrap;font-family:monospace;margin-bottom:14px;line-height:1.7;}
.modal input{width:100%;background:#080812;border:1.5px solid rgba(255,255,255,.09);border-radius:8px;padding:11px 13px;color:#F0F0F8;font-size:13px;margin-bottom:12px;}
.modal input:focus{outline:none;border-color:#00C2B7;}
.m-acts{display:flex;gap:9px;}
.btn-cancel{padding:10px 18px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);border-radius:9px;color:#888899;font-size:12px;font-weight:700;cursor:pointer;}

@media(max-width:560px){.voice-grid{grid-template-columns:1fr;}.opt-grid{grid-template-columns:1fr 1fr;}.plat-grid{grid-template-columns:repeat(3,1fr);}}
</style>
</head>
<body>
<div id="app"></div>
<script>

// ============================================================
// CONFIG
// ============================================================
const CFG = { portalId:'', formGuid:'' };

// ============================================================
// STATE
// ============================================================
const S = {
  screen:'gate',
  modal:null,
  gErr:null,
  wErr:null,
  user:{name:'',email:'',business:''},
  wStep:0,
  ans:{industry:'',audience:'',offer:'',voice:'',goals:[],platforms:[]},
  pillars:[],
  pillarErr:null,
  genStep:0,
  posts:{},
  genBusy:{},
  postErr:{},
  expanded:null,
  ctab:{},
  pstatus:{},
  activePlat:null,
  filters:{pillar:'all',format:'all'},
  cpState:{},
  portalId:'', formGuid:''
};

// ============================================================
// PLATFORMS
// ============================================================
const PLATS = [
  {id:'ig',label:'Instagram',icon:'📸',color:'#E1306C',limit:2200,formats:['Carousel','Reel','Static Post','Story']},
  {id:'li',label:'LinkedIn',icon:'💼',color:'#0A66C2',limit:3000,formats:['Text Post','Carousel/Doc','Video','Image+Text']},
  {id:'fb',label:'Facebook',icon:'📘',color:'#1877F2',limit:5000,formats:['Text Post','Video','Image Post']},
  {id:'tt',label:'TikTok',icon:'🎵',color:'#FF2D55',limit:2200,formats:['Hook/Script','Talking Head','Trending Audio','Stitch/Duet']},
  {id:'th',label:'Threads',icon:'🧵',color:'#AAAAAA',limit:500,formats:['Text Thread','Quote Post','Poll','Image Post']},
  {id:'x',label:'X (Twitter)',icon:'🐦',color:'#1DA1F2',limit:280,formats:['Tweet','Thread','Quote Tweet','Poll']}
];
const plat = id => PLATS.find(p=>p.id===id);

// ============================================================
// WIZARD STEPS
// ============================================================
const WIZ = [
  {id:'industry',num:'STEP 1 OF 6',type:'select',
   q:'What type of business do you run?',
   sub:'This shapes your content topics and tone across all platforms.',
   opts:['Retail / E-commerce','Restaurant / Food','Health & Wellness','Beauty / Personal Care',
     'Professional Services','Real Estate','Coaching / Consulting','Creative Services',
     'Tech / SaaS','Construction / Trades','Non-profit','Other']},
  {id:'audience',num:'STEP 2 OF 6',type:'text',
   q:'Who is your ideal customer?',
   sub:'Describe them: who they are, what they struggle with, and what they want.',
   ph:'Example: Small business owners who struggle to get consistent clients and want to build steady revenue without spending a lot on ads.'},
  {id:'offer',num:'STEP 3 OF 6',type:'text',
   q:'What is your core offer?',
   sub:'The main product or service you want this content to drive people toward.',
   ph:'Example: A 6-week coaching program for first-time entrepreneurs launching their first offer online.'},
  {id:'voice',num:'STEP 4 OF 6',type:'voice',
   q:'How does your brand sound?',
   sub:'Pick the voice that feels most like you.',
   opts:[
     {v:'bold',title:'Bold & Direct',desc:'No fluff. Straight to the point. You say what others are afraid to say.'},
     {v:'warm',title:'Warm & Relatable',desc:'Conversational and human. Like a trusted friend who happens to have all the answers.'},
     {v:'expert',title:'Expert & Authoritative',desc:'Credible, research-backed, professional. You lead with depth and knowledge.'},
     {v:'inspirational',title:'Inspirational & Story-Driven',desc:'Motivating, narrative-heavy, emotionally resonant. You move people to act.'},
     {v:'educational',title:'Educational & Clear',desc:'Simple breakdowns and step-by-step. You make the complex feel easy.'},
     {v:'playful',title:'Playful & Energetic',desc:'Fun, light, pop-culture aware. You make people smile while they learn.'}
   ]},
  {id:'goals',num:'STEP 5 OF 6',type:'multi',
   q:'What are your top content goals?',
   sub:'Select all that apply.',
   opts:['Generate leads','Drive sales','Build brand awareness','Grow community',
     'Establish thought leadership','Increase website traffic','Build email list','Showcase work']},
  {id:'platforms',num:'STEP 6 OF 6',type:'platforms',
   q:'Which platforms do you post on?',
   sub:'Select all that apply. We will generate 30 tailored posts for each one.'}
];

const WEEKS = [
  {label:'Week 1',days:[1,2,3,4,5,6,7],theme:'Establish + Educate'},
  {label:'Week 2',days:[8,9,10,11,12,13,14],theme:'Build Trust + Go Deeper'},
  {label:'Week 3',days:[15,16,17,18,19,20,21],theme:'Authority + Social Proof'},
  {label:'Week 4',days:[22,23,24,25,26,27,28],theme:'Conversion + Offers'},
  {label:'Final Push',days:[29,30],theme:'Final Push'}
];

// ============================================================
// UTILS
// ============================================================
function esc(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function ea(s){return(s||'').replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/\n/g,'\\n').replace(/"/g,'&quot;');}
function h2r(hex,a){const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);return`rgba(${r},${g},${b},${a})`;}

  const app=document.getElementById('app');
  let html='';
  if(S.screen==='gate') html=rGate();
  else if(S.screen==='wizard') html=rWizard();
  else if(S.screen==='generating') html=rGenerating();
  else if(S.screen==='pillars') html=rPillars();

  if(S.modal==='webhook') html+=rModal();
  app.innerHTML=html;
  bindListeners();
}

          {name:'company',value:biz}
        ],
        context:{
          pageUri:'https://tools.clairenhaus.com/calendar',
          pageName:'30-Day Content Calendar Generator'
        }
      })
    }).catch(()=>{});
  }
  S.screen='wizard';S.wStep=0;render();
}

function rWizard(){
  const step=WIZ[S.wStep];
  const dots=WIZ.map((_,i)=>`<div class="wdot ${i<S.wStep?'done':i===S.wStep?'active':''}"></div>`).join('');
  let body='';
  if(step.type==='select'){
    body=`<div class="opt-grid">${step.opts.map(o=>`<div class="opt${S.ans.industry===o?' sel':''}" onclick="pick('industry','${ea(o)}')">${esc(o)}</div>`).join('')}</div>`;
  } else if(step.type==='text'){
    body=`<textarea class="ta-input" id="ta" placeholder="${esc(step.ph)}" oninput="taSync()" onkeyup="taSync()" onpaste="setTimeout(taSync,0)">${esc(S.ans[step.id]||'')}</textarea>`;
  } else if(step.type==='voice'){
    body=`<div class="voice-grid">${step.opts.map(o=>`<div class="voice-opt${S.ans.voice===o.v?' sel':''}" onclick="pick('voice','${o.v}')"><div class="voice-t">${esc(o.title)}</div><div class="voice-d">${esc(o.desc)}</div></div>`).join('')}</div>`;
  } else if(step.type==='multi'){
    body=`<div class="opt-grid">${step.opts.map(o=>`<div class="opt${(S.ans.goals||[]).includes(o)?' msel':''}" onclick="togGoal('${ea(o)}')">${esc(o)}</div>`).join('')}</div>`;
  } else if(step.type==='platforms'){
    body=`<div class="plat-grid">${PLATS.map(p=>`<div class="plat-opt${(S.ans.platforms||[]).includes(p.id)?' sel':''}" onclick="togPlat('${p.id}')"><div class="plat-ico">${p.icon}</div><div class="plat-nm">${p.label}</div></div>`).join('')}</div>`;
  }
  const ok=canNext();
  return`<div class="wizard">
  <div class="gbar"></div>
  <div class="wiz-body">
    <div class="wiz-top"><div class="logo">CLAIREN<em>HAUS</em></div><div class="wiz-prog">${dots}</div></div>
    <div class="step-anim">
      <div class="step-num">${step.num}</div>
      <div class="step-q">${esc(step.q)}</div>
      <div class="step-sub">${esc(step.sub)}</div>
      ${body}
      ${S.wErr?`<div class="err">${S.wErr}</div>`:''}
      <div class="wiz-nav">
        ${S.wStep>0?`<button class="btn-back" onclick="wizBack()">← Back</button>`:''}
        <button class="btn-next" onclick="wizNext()" ${!ok?'disabled':''}>${S.wStep===WIZ.length-1?'Generate My Calendar →':'Continue →'}</button>
      </div>
    </div>
  </div></div>`;
}

function pick(k,v){S.ans[k]=v;S.wErr=null;render();}
function togGoal(v){const a=S.ans.goals||[];const i=a.indexOf(v);i>-1?a.splice(i,1):a.push(v);S.ans.goals=a;render();}
function togPlat(id){const a=S.ans.platforms||[];const i=a.indexOf(id);i>-1?a.splice(i,1):a.push(id);S.ans.platforms=a;render();}

function canNext(){
  const s=WIZ[S.wStep];
  if(s.type==='select') return !!S.ans.industry;
  if(s.type==='text') return (S.ans[s.id]||'').trim().length>2;
  if(s.type==='voice') return !!S.ans.voice;
  if(s.type==='multi') return (S.ans.goals||[]).length>0;
  if(s.type==='platforms') return (S.ans.platforms||[]).length>0;
  return true;
}
function wizBack(){S.wStep=Math.max(0,S.wStep-1);S.wErr=null;render();}
function wizNext(){
  if(!canNext()){S.wErr='Please make a selection to continue.';render();return;}
  if(S.wStep<WIZ.length-1){S.wStep++;S.wErr=null;render();}
  else{S.screen='generating';render();genPillars();}
}

async function genPillars(){
  S.genStep=0;S.pillarErr=null;render();
  const prompt=`You are a social media content strategist. Based on this business profile, create exactly 5 distinct content pillars for a 30-day social media calendar.

Business: ${S.user.business}
Industry: ${S.ans.industry}
Target Audience: ${S.ans.audience}
Core Offer: ${S.ans.offer}
Brand Voice: ${S.ans.voice}
Content Goals: ${(S.ans.goals||[]).join(', ')}
Platforms: ${(S.ans.platforms||[]).map(id=>plat(id)?.label).join(', ')}

Return ONLY valid JSON. No markdown, no explanation:
{"pillars":[{"key":"slug","label":"Pillar Name","description":"One sentence on what this covers and why it matters for this specific business.","color":"#hexcolor","emoji":"emoji"}]}

Rules:
- Exactly 5 pillars. Each serves a distinct purpose.
- Include: at least one education/value pillar, one trust/social proof pillar, one direct CTA/offer pillar.
- Make labels specific to this business, not generic.
- Colors must be distinct and vibrant. Use hex only.
- No em dashes anywhere. Use commas or periods instead.`;

  const t1=setTimeout(()=>{S.genStep=1;render();},700);
  const t2=setTimeout(()=>{S.genStep=2;render();},1400);
  const timeout=new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')),30000));
  try{
    const res=await Promise.race([
      fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:1000,messages:[{role:'user',content:prompt}]})}),
      timeout
    ]);
    clearTimeout(t1);clearTimeout(t2);
    if(!res.ok){
      const errText=await res.text();
      throw new Error(`API error ${res.status}: ${errText}`);
    }
    const d=await res.json();
    if(d.error) throw new Error(d.error.message||'API returned an error');
    const txt=d.content?.find(c=>c.type==='text')?.text||'';
    if(!txt) throw new Error('Empty response from API');
    const parsed=JSON.parse(txt.replace(/```json|```/g,'').trim());
    if(!parsed.pillars?.length) throw new Error('No pillars returned');
    S.pillars=parsed.pillars;
    S.screen='pillars';render();
  }catch(e){
    clearTimeout(t1);clearTimeout(t2);
    S.pillarErr=`Error: ${e.message}. Please try again.`;render();
  }
}

    ${pillarFilters}

function rCard(post,platform){
  const id=`${platform.id}-${post.day}`;
  const pillar=S.pillars.find(p=>p.key===post.pillar)||S.pillars[0];
  const isExp=S.expanded===id;
  const tab=S.ctab[id]||'content';
  const status=S.pstatus[id]||'draft';
  const content=post.content||'';
  const cl=content.length;
  const lim=platform.limit;
  const pct=cl/lim;
  const ccls=pct<0.8?'cc-ok':pct<1?'cc-warn':'cc-over';
  const isIG=platform.id==='ig';

  let body='';
  if(isExp){
    const cid=`c-${id}`;
    const showAlt=isIG;
    const tabList=[{k:'content',l:'📝 Post'}, ...(showAlt?[{k:'alt',l:'🏷 Alt Text'}]:[]), {k:'hashtags',l:'# Hashtags'},{k:'design',l:'🤖 Design Bot'}];
    const tabHtml=tabList.map(t=>`<button class="ctab2${tab===t.k?' act':''} ${t.k==='design'?'design':''}" onclick="setCTab('${id}','${t.k}');event.stopPropagation()">${t.l}</button>`).join('');
    let tc='';
    if(tab==='content'){
      tc=`<div class="cbox"><p>${esc(content)}</p></div>
      <div class="${ccls} cc">${cl.toLocaleString()} / ${lim.toLocaleString()} characters</div>
      <div class="card-acts">
        <button id="${cid}" class="act-btn btn-cpy" onclick="cpyText('${cid}','${ea(post.hook+'\\n\\n'+content)}','Copy Post');event.stopPropagation()">Copy Post</button>
        <button class="act-btn btn-regen" onclick="regenPost('${platform.id}',${post.day});event.stopPropagation()">↻ Rewrite</button>
        <select class="sselect" onchange="setPStat('${id}',this.value)" onclick="event.stopPropagation()">
          <option value="draft"${status==='draft'?' selected':''}>Draft</option>
          <option value="scheduled"${status==='scheduled'?' selected':''}>Scheduled</option>
          <option value="published"${status==='published'?' selected':''}>Published</option>
        </select>
      </div>`;
    } else if(tab==='alt'&&showAlt){
      const aid=`a-${id}`;
      tc=`<div class="ebox e-alt"><div class="ebox-lbl" style="color:#4A6FFF">INSTAGRAM ALT TEXT</div><p>${esc(post.alttext||'No alt text generated.')}</p></div>
      <div class="card-acts"><button id="${aid}" class="act-btn btn-cpy" onclick="cpyText('${aid}','${ea(post.alttext||'')}','Copy Alt Text');event.stopPropagation()">Copy Alt Text</button></div>`;
    } else if(tab==='hashtags'){
      const hid=`h-${id}`;
      tc=`<div class="ebox e-hash"><div class="ebox-lbl" style="color:#00C2B7">HASHTAGS</div><p>${esc(post.hashtags||'')}</p></div>
      <div class="card-acts"><button id="${hid}" class="act-btn btn-cpy" onclick="cpyText('${hid}','${ea(post.hashtags||'')}','Copy Hashtags');event.stopPropagation()">Copy Hashtags</button></div>`;
    } else if(tab==='design'){
      const dp=buildDP(post,platform,pillar);
      const did=`d-${id}`;
      tc=`<div class="dbox-h"><div class="dbox-t">🤖 CLAIREN HAUS DESIGN BOT</div><div class="dbox-s">Paste into your custom GPT with your brand reference photo</div></div>
      <div class="codebox"><pre>${esc(dp)}</pre></div>
      <div class="card-acts"><button id="${did}" class="act-btn btn-cpy" style="background:#9B59FF" onclick="cpyText('${did}','${ea(dp)}','Copy Prompt');event.stopPropagation()">Copy Design Prompt</button></div>`;
    }
    body=`<div class="card-b" onclick="event.stopPropagation()"><div class="ctabs">${tabHtml}</div>${tc}</div>`;
  }

  const sLabel=status.charAt(0).toUpperCase()+status.slice(1);
  const hdBg=h2r(pillar.color,.09);
  return`<div class="pcard${isExp?' exp':''}" style="--pc:${pillar.color}" onclick="togCard('${id}')">
  <div class="card-h" style="background:${hdBg}">
    <div class="card-m">
      <div class="cbadges"><span class="dbadge">Day ${post.day}</span><span class="fbadge">${esc(post.format)}</span></div>
      <span class="plbl" style="color:${pillar.color}">${pillar.emoji||''} ${esc(pillar.label)}</span>
    </div>
    <p class="chook">${esc(post.hook)}</p>
  </div>
  ${isExp?body:`<div class="card-p"><span>Click to expand →</span><span class="sbadge s-${status}">${sLabel}</span></div>`}
  </div>`;
}

  const dims={ig:'1080x1350px (4:5)',li:'1200x628px (1.91:1)',fb:'1200x628px (1.91:1)',tt:'1080x1920px (9:16)',th:'1080x1080px (1:1)',x:'1200x628px (1.91:1)'};
  return`BRAND: ${S.user.business}
PLATFORM: ${platform.label}
FORMAT: ${post.format}
DIMENSIONS: ${dims[platform.id]||'1080x1080px'}
CONTENT PILLAR: ${pillar.label}

HEADLINE:
${post.hook}

SUBTEXT:
${(post.content||'').split('\n').filter(l=>l.trim())[0]||''}

BRAND VOICE: ${S.ans.voice}
PILLAR ACCENT COLOR: ${pillar.color}

VISUAL DIRECTION:
Dark background. Bold typography. Clean, editorial composition.
High contrast between background and type. No clutter.

AVOID:
Stock photo clichés. Light backgrounds unless specifically requested.
Generic layouts that could belong to any brand.

INSTRUCTIONS:
Generate ONE design. Wait for YES before proceeding.`;
}

async function genPosts(pid){
  S.genBusy={...S.genBusy,[pid]:true};S.postErr={...S.postErr,[pid]:null};render();
  const p=plat(pid);
  const pillarList=S.pillars.map(pl=>`- key:"${pl.key}" label:"${pl.label}" desc:"${pl.description}"`).join('\n');
  const isIG=pid==='ig';
  const isShort=pid==='th'||pid==='x';

  const prompt=`You are a professional social media strategist. Create exactly 30 ${p.label} posts for this business.

BUSINESS: ${S.user.business}
INDUSTRY: ${S.ans.industry}
AUDIENCE: ${S.ans.audience}
CORE OFFER: ${S.ans.offer}
BRAND VOICE: ${S.ans.voice}
GOALS: ${(S.ans.goals||[]).join(', ')}

CONTENT PILLARS (6 posts each, exactly):
${pillarList}

PLATFORM: ${p.label}
FORMATS AVAILABLE: ${p.formats.join(', ')}
CHARACTER LIMIT: ${p.limit} characters for content field

Return ONLY valid JSON. No markdown, no preamble:
{"posts":[{"day":1,"pillar":"pillar_key","format":"format name","hook":"Attention-grabbing opener. 12 words max.","content":"Full post body. Under ${p.limit} chars. ${isShort?'Short and punchy.':'Include a clear call to action.'} No em dashes anywhere.","hashtags":"${isShort?'3-5':'8-15'} relevant hashtags"${isIG?',"alttext":"Descriptive alt text under 80 words. Mention brand, subject, context."':''}}]}

REQUIREMENTS:
- Exactly 30 posts. Days 1 through 30.
- Distribute pillars evenly: exactly 6 posts per pillar.
- Rotate formats naturally across the 30 days.
- Each post must feel fresh and distinct from the others.
- All content must feel specific to ${S.user.business}, never generic.
- No em dashes anywhere. Use commas, colons, or periods instead.
- Week 1 (1-7): Establish and educate. Week 2 (8-14): Build trust. Week 3 (15-21): Authority. Week 4 (22-28): Conversion. Days 29-30: Final push.`;

  try{
    const res=await fetch('/api/claude',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:8000,messages:[{role:'user',content:prompt}]})});
    const d=await res.json();
    const txt=d.content?.find(c=>c.type==='text')?.text||'';
    const parsed=JSON.parse(txt.replace(/```json|```/g,'').trim());
    S.posts={...S.posts,[pid]:parsed.posts};
    S.genBusy={...S.genBusy,[pid]:false};render();
  }catch(e){
    S.genBusy={...S.genBusy,[pid]:false};
    S.postErr={...S.postErr,[pid]:'Generation failed. Please try again.'};render();
  }
}

async function regenPost(pid,day){
  const p=plat(pid);
  const posts=[...(S.posts[pid]||[])];
  const i=posts.findIndex(p=>p.day===day);
  if(i<0) return;
  const old=posts[i];
  const pl2=S.pillars.find(pl=>pl.key===old.pillar);
  posts[i]={...old,hook:'Rewriting...',content:'One moment...',_busy:true};
  S.posts={...S.posts,[pid]:posts};render();

  const prompt=`Rewrite this single ${p.label} post for ${S.user.business}. Make it completely different from the previous version.

Pillar: ${pl2?.label||old.pillar}
Format: ${old.format}
Brand Voice: ${S.ans.voice}
Audience: ${S.ans.audience}
Previous hook (do NOT reuse): ${old.hook}

Return ONLY valid JSON (no markdown):
{"day":${day},"pillar":"${old.pillar}","format":"${old.format}","hook":"New hook. 12 words max.","content":"Full post body. Under ${p.limit} chars. No em dashes.","hashtags":"Relevant hashtags"${pid==='ig'?',"alttext":"Alt text under 80 words."':''}}`;

  try{
    const res=await fetch('/api/claude',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:1000,messages:[{role:'user',content:prompt}]})});
    const d=await res.json();
    const txt=d.content?.find(c=>c.type==='text')?.text||'';
    const np=JSON.parse(txt.replace(/```json|```/g,'').trim());
    const upd=[...(S.posts[pid]||[])];
    const idx=upd.findIndex(p=>p.day===day);
    if(idx>-1) upd[idx]=np;
    S.posts={...S.posts,[pid]:upd};render();
  }catch(e){
    const upd=[...(S.posts[pid]||[])];
    const idx=upd.findIndex(p=>p.day===day);
    if(idx>-1) upd[idx]=old;
    S.posts={...S.posts,[pid]:upd};render();
  }
}

// ============================================================
// EXPORT CSV (Buffer compatible)
// ============================================================
function exportCSV(pid){
  const posts=S.posts[pid]||[];
  const p=plat(pid);
  const isIG=pid==='ig';
  const headers=['Day','Pillar','Format','Hook','Content','Hashtags',...(isIG?['Alt Text']:[])];
  const rows=[headers,...posts.map(p=>[p.day,p.pillar,p.format,p.hook,p.content,p.hashtags,...(isIG?[p.alttext||'']:[])])];
  const csv=rows.map(r=>r.map(c=>'"'+(c||'').toString().replace(/"/g,'""')+'"').join(',')).join('\n');
  const a=document.createElement('a');
  a.href='data:text/csv;charset=utf-8,'+encodeURIComponent(csv);
  a.download=`${S.user.business.replace(/\s+/g,'-')}-${p.label}-30day.csv`;
  a.click();
}

function swPlat(id){S.activePlat=id;S.expanded=null;S.filters={pillar:'all',format:'all'};render();}
function setF(k,v){S.filters={...S.filters,[k]:v};render();}
function togCard(id){S.expanded=S.expanded===id?null:id;if(S.expanded&&!S.ctab[id])S.ctab[id]='content';render();}
function setCTab(id,t){S.ctab={...S.ctab,[id]:t};render();}
function setPStat(id,v){S.pstatus={...S.pstatus,[id]:v};render();}

function cpyText(btnId,text,label){
  const decoded=text.replace(/\\n/g,'\n').replace(/\\'/g,"'");
  navigator.clipboard.writeText(decoded).then(()=>{
    const b=document.getElementById(btnId);if(!b)return;
    b.textContent='✓ Copied!';b.classList.add('cpd');
    clearTimeout(S.cpState[btnId]);
    S.cpState[btnId]=setTimeout(()=>{const x=document.getElementById(btnId);if(x){x.textContent=label;x.classList.remove('cpd');}},2000);
  });
}

function taSync(){
  const ta=document.getElementById('ta');
  if(!ta) return;
  const s=WIZ[S.wStep];
  S.ans[s.id]=ta.value;
  const ok=canNext();
  const btn=document.querySelector('.btn-next');
  if(btn) btn.disabled=!ok;
}
